// Ativo em verde e desligado em cinza: as mesmas cores de lote vigente e substituido.
const EMPLOYMENT_STATUS_LABEL = { ACTIVE: ['Ativo', 'PUBLISHED'], TERMINATED: ['Desligado', 'SUPERSEDED'] }
const EMPLOYEES_PER_PAGE = 50
const NO_EMPLOYEE_FILTER = { search: '', employeeNumber: '', status: '', hireDateFrom: '', hireDateTo: '', page: 1 }
let employeeFilter = NO_EMPLOYEE_FILTER

/** Tempo de casa até hoje, por aniversário de calendário como o `completedYears` da API. Só exibição:
 * a faixa do convênio é decidida na API. Admissão ausente ou no futuro = traço. */
function tenureText(hireDate, today = new Date()) {
  const m = String(hireDate || '').match(/^(\d{4})-(\d{2})-(\d{2})/)
  if (!m) return '—'
  const months = (today.getFullYear() - Number(m[1])) * 12 + (today.getMonth() + 1 - Number(m[2])) - (today.getDate() < Number(m[3]) ? 1 : 0)
  if (months < 0) return '—'
  const n = (q, one, many) => q + ' ' + (q === 1 ? one : many)
  const years = Math.floor(months / 12)
  const remainder = months % 12
  if (!years) return remainder ? n(remainder, 'mês', 'meses') : 'menos de 1 mês'
  return n(years, 'ano', 'anos') + (remainder ? ' e ' + n(remainder, 'mês', 'meses') : '')
}

// O selftest cobre as duas funcoes puras que erram em silencio: uma chave a mais no payload e o
// `.strict()` da API recusa o PATCH inteiro; uma mensagem de erro mal extraida esconde o motivo.
// E as derivacoes de tela que decidem o que o operador/colaborador ve: trilha da saga (sem vazar
// etapa de inelegivel), filas, desfecho desconhecido, leitura da auditoria e lote vigente.
function selftest() {
  const cases = []
  const check = (name, actual, expected) => cases.push({
    name, ok: JSON.stringify(actual) === JSON.stringify(expected), actual: JSON.stringify(actual), expected: JSON.stringify(expected),
  })

  check('omite vazios, ignora chave desconhecida, apara espaços',
    buildSupplementPayload({ motherName: '  Maria  ', documentNumber: '', documentState: '   ', unknownKey: 'x', pep: '' }),
    { motherName: 'Maria' })
  check('renda em pt-BR vira número',
    buildSupplementPayload({ otherIncome: '1.250,50' }).otherIncome, 1250.5)
  check('renda sem milhar também', parseBrNumber('1250,50'), 1250.5)
  check('renda já em formato cru passa direto', parseBrNumber('1250.5'), 1250.5)
  check('pep só entra quando escolhido — "nao" é false',
    buildSupplementPayload({ pep: 'nao' }), { pep: false })
  check('pep "sim" é true', buildSupplementPayload({ pep: 'sim' }), { pep: true })
  check('message em lista vira frase', errorMessage({ message: ['a', 'b'] }, 400), 'a b')
  check('esteira ausente não desenha nada', pipelineBox(null), '')
  check('esteira traduz a situação', /Liberada — Tela de confirmação/.test(pipelineBox({ status: 'DISBURSED', activityDescription: 'Tela de confirmação', reasons: [] })), true)
  check('problem+json usa o title', errorMessage({ title: 'Proposta não encontrada.', status: 404 }, 404), 'Proposta não encontrada.')
  check('erro do Zod mostra o motivo, não "Validation failed"',
    errorMessage({ statusCode: 400, message: 'Validation failed', errors: [{ message: 'Informe exatamente um dos dois.' }] }, 400),
    'Informe exatamente um dos dois.')
  check('sem message usa fallback por status', errorMessage(null, 500), 'Serviço indisponível agora. Tente novamente.')
  check('data ISO vira pt-BR', formatDate('2026-03-09T00:00:00.000Z'), '09/03/2026')
  check('convênio explica a faixa de tempo de casa',
    agreementText({ code: '003030', tenureMinYears: 1, tenureMaxYears: 3 }, 2),
    'Convênio 003030 — de 1 a 3 anos de casa (você tem 2 anos)')
  check('faixa aberta vira "ou mais"',
    agreementText({ code: '003034', tenureMinYears: 7, tenureMaxYears: null }, 9),
    'Convênio 003034 — 7 anos de casa ou mais (você tem 9 anos)')
  check('status da spec tem rótulo', STATUS_LABEL.AWAITING_CUSTOMER_DATA, 'Aguardando cadastro')
  check('mensagem sai do status, não da API', [STATUS_MESSAGE.INELIGIBLE, STATUS_MESSAGE.SUBMITTED], ['Não há oferta disponível para o cliente informado.', undefined])
  check('estado interno traduzido, código junto', labelCodeText(INTERNAL_STATUS_LABEL, 'ERROR_RETRYABLE'), 'Erro retentável · ERROR_RETRYABLE')
  check('motivo com detalhe usa o prefixo', labelOf(REASON_LABEL, 'FUNCAO_UNAVAILABLE: inclusao http=503'), 'Função indisponível')
  check('código sem rótulo aparece cru', [reasonLabel('NOVO_CODIGO'), reasonLabel(null)], ['NOVO_CODIGO', '—'])
  check('box de código: rótulo no valor, código no sub', codeBox('Estado interno', INTERNAL_STATUS_LABEL, 'FAILED_PERMANENT'),
    { label: 'Estado interno', value: 'Falha definitiva (DLQ)', sub: 'FAILED_PERMANENT' })
  check('status da etapa traduzido', ['PENDING', 'SUCCEEDED', 'FAILED'].map(stepStatusLabel), ['em andamento', 'concluída', 'com falha'])
  const today = new Date(2026, 9, 12)
  check('tempo de casa em anos e meses', tenureText('2024-03-10', today), '2 anos e 7 meses')
  check('tempo de casa fecha o ano no aniversário', tenureText('2025-10-12', today), '1 ano')

  const states = (p) => journeySteps(p).map((e) => e.state)
  check('trilha: simulada fecha elegibilidade, convênio e simulação',
    states({ status: 'SIMULATED', currentStep: { step: 'SIMULATION', status: 'SUCCEEDED' } }),

  const f = queuesSummary([

  check('filas: contagens', [f.submitting.length, f.awaitingData.length, f.dlq.length, f.byInternalStatus[0]], [1, 0, 1, ['ERROR_RETRYABLE', 2]])

  check('inclusão em curso não é desfecho desconhecido',

  check('DLQ orienta nova simulação, não reprocesso', /nova simulação/.test(supportNote(historyView('FAILED_PERMANENT'))), true)
  check('retry agendado: o worker reprocessa sozinho', /sozinho/.test(supportNote(historyView('ERROR_RETRYABLE', [], 'UNDER_REVIEW'))), true)
  check('desfecho desconhecido: o serviço resolve sozinho', /Função a cada minuto/.test(supportNote(historyView('SUBMITTING', [{ step: 'INCLUSION', status: 'PENDING', reasonCode: 'PROPOSAL_OUTCOME_UNKNOWN' }]))), true)

  const currentBatches = currentByDataset([

    { dataset: 'EMPLOYMENT', status: 'PUBLISHED', publishedAt: '2026-09-20', id: 'b' },

  check('lote vigente é o PUBLISHED, nunca REJECTED/SUPERSEDED', currentBatches.EMPLOYMENT && currentBatches.EMPLOYMENT.id, 'b')

  check('status do lote no vocabulário do operador', ['PROCESSING', 'PUBLISHED', 'REJECTED'].map(batchStatusLabel).join('/'), 'Processando/Processado/Erro')
  check('health fica fora do /api', serviceRoot('http://localhost:3010/api/'), 'http://localhost:3010')

  // Revisão do Reviewr (B1–B9, S1–S7)
  check('roteamento por status e condição escolhida', [
    { status: 'SIMULATED', selectedOfferId: null },
    { status: 'AWAITING_CUSTOMER_DATA', selectedOfferId: 'c' },
    { status: 'SIMULATED', selectedOfferId: 'c' },
    { status: 'ERROR', selectedOfferId: 'c', canRetry: true },
    { status: 'ERROR', selectedOfferId: 'c', canRetry: false },
    { status: 'UNDER_REVIEW', selectedOfferId: 'c' },
    { status: 'INELIGIBLE', selectedOfferId: null },
  ].map(stepFor), [2, 3, 4, 4, 5, 5, 5])
  check('B1: recusa da inclusão (canRetry) volta ao envio', canResume({ status: 'ERROR', selectedOfferId: 'c', canRetry: true }), true)
  check('B1: erro sem condição (simulação) não oferece', canResume({ status: 'ERROR', selectedOfferId: null, canRetry: true }), false)
  check('B1: DLQ (sem canRetry) não oferece', canResume({ status: 'ERROR', selectedOfferId: 'c', canRetry: false }), false)
  check('crédito máximo é a oferta de maior valor da Função', bestOffer([{ requestedAmount: 900 }, { requestedAmount: 1500 }, { requestedAmount: 1200 }]), { requestedAmount: 1500 })
  check('sem oferta não há crédito máximo', [bestOffer([]), bestOffer(undefined)], [null, null])
  check('ajuste: oferta do requote não se diz crédito máximo',
    [offerHeadline({ requestedInstallment: null }), offerHeadline({ requestedInstallment: 600 })], ['Valor escolhido por você', 'Crédito máximo disponível'])

  check('ajuste: abaixo do piso, acima do máximo ou vazio não vai à API',

  check('erro do Zod leva o nome do campo',

  check('maxlength espelha a API', /maxlength="25"/.test(textInput('district', '')), true)

  check('S3: polling desacelera e para', [0, 9, 10, 29, 30].map(nextPollDelay), [3000, 3000, 15000, 15000, null])

  const t1 = newScreen()

// Uma pagina, tres publicos: colaborador em /, backoffice em /admin/ e developer em /dev/ (ou
// #admin/#dev, para quem serve a pasta com um servidor estatico simples). O switch do cabecalho
// troca pelo hash, sem reload: a jornada do colaborador continua no sessionStorage e a aba de cada
// portal em memoria, entao ir e voltar nao perde o ponto em que cada um estava. O hash vence o caminho.
const MODES = {
  colaborador: { title: 'Consignado Privado — proposta', brand: 'Consignado Privado', sub: 'Crédito com desconto em folha' },
  admin: { title: 'Backoffice — Consignado', brand: 'Backoffice', sub: 'Operação do Consignado Privado' },
  dev: { title: 'Developer — Consignado', brand: 'Developer', sub: 'Filas, DLQ e cargas em segundo plano' },
}
function currentMode() {
  const fromHash = location.hash.slice(1)
  if (MODES[fromHash]) return fromHash
  const fromPath = (location.pathname.match(/^\/(admin|dev)(\/|$)/) || [])[1]
  return fromPath || 'colaborador'
}

function applyMode() {
  if (location.hash === '#selftest') return selftest()
  const mode = currentMode()
  const portal = mode !== 'colaborador'
  // O polling do acompanhamento nao pode repintar a tela do portal por cima, nem o das filas a do
  // colaborador.
  clearTimeout(pollTimer)
  clearTimeout(queuesTimer)
  document.body.classList.toggle('admin', portal)
  document.body.classList.toggle('dev', mode === 'dev')
  document.title = MODES[mode].title
  document.getElementById('marca').firstChild.textContent = MODES[mode].brand
  document.getElementById('marca-sub').textContent = MODES[mode].sub
  for (const b of document.querySelectorAll('[data-modo]')) {
    b.setAttribute('aria-selected', String(b.dataset.modo === mode))
  }
  if (portal) {
    portalMode = mode
    renderAdmin()
  } else {
    render()
  }
  window.scrollTo(0, 0)
}

for (const b of document.querySelectorAll('[data-modo]')) {
  b.onclick = () => { location.hash = '#' + b.dataset.modo }
}
window.addEventListener('hashchange', applyMode)
applyMode()
if (location.hash !== '#selftest') paintHealth()
</script>
