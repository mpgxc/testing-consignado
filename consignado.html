      otherIncome: 'Renda mensal adicional', correctedPhone: 'Telefone', correctedPostalCode: 'CEP',
      correctedStreet: 'Rua', correctedStreetNumber: 'Número do endereço', correctedBankCode: 'Código do banco',
      correctedBankBranch: 'Agência', correctedBankAccount: 'Conta',
    }

    /** Espelha FIELD_MAX_LENGTH da API (customer-data-fields.ts): o input corta antes do 400 do Zod. */
    const FIELD_MAX_LENGTH = {
      documentNumber: 16, documentIssuer: 8, motherName: 40, city: 40, district: 25,
      accountCheckDigit: 2, branchCheckDigit: 4, correctedPhone: 20, correctedStreet: 35,
      correctedStreetNumber: 6, correctedBankCode: 3, correctedBankBranch: 10, correctedBankAccount: 20,
      correctedPostalCode: 9, documentState: 2, state: 2,
    }

    // Campo curto (UF, digito, orgao emissor) divide a linha no celular; o resto ocupa a linha toda.
    function formField(name, label, input, required) {
      return '<div' + (FIELD_MAX_LENGTH[name] <= 8 ? ' class="curto"' : '') + '><label for="' + name + '">' + label + (required ? ' <span class="req">*</span>' : '') + '</label>' + input + '</div>'
    }

    const textInput = (name, value, extra) => '<input id="' + name + '" name="' + name + '" value="' + esc(value || '') + '"' +
      (FIELD_MAX_LENGTH[name] ? ' maxlength="' + FIELD_MAX_LENGTH[name] + '"' : '') + (extra || '') + '>'

    function selectInput(name, value, options, emptyText) {
      return '<select id="' + name + '" name="' + name + '">' +
        (emptyText ? '<option value="">Selecione</option>' : '') +
        options.map(([v, r]) => '<option value="' + esc(v) + '"' + (String(value) === v ? ' selected' : '') + '>' + esc(r) + '</option>').join('') +
        '</select>'
    }

    /** `open`: ja abre em edicao — e o caso de campo que falta (sem ele nao ha onde digitar). */
    function editableBlock(id, label, display, fields, open) {
      return '<div class="box editavel">' +
        '<div class="cab"><div class="rot">' + label + '</div><button type="button" class="alterar" data-bloco="' + id + '">' + (open ? 'Concluir' : 'Alterar') + '</button></div>' +
        '<div class="val' + (open ? ' oculto' : '') + '" id="ver-' + id + '">' + esc(display || 'Não informado') + '</div>' +
        '<div class="grid form' + (open ? '' : ' oculto') + '" id="edit-' + id + '" style="margin-top:10px">' + fields + '</div>' +
        '</div>'
    }

    const addressText = (k) => [k.street, k.streetNumber].filter(Boolean).join(', ') + (k.postalCode ? ' — CEP ' + formatPostalCode(k.postalCode) : '')
    const bankText = (k) => [k.bankCode && 'Banco ' + k.bankCode, k.bankBranch && 'Agência ' + k.bankBranch, k.bankAccount && 'Conta ' + k.bankAccount].filter(Boolean).join(' · ')

    function customerDataScreen(isCurrent) {
      app.innerHTML = '<div class="card"><p class="hint">Carregando seus dados…</p></div>'

      api('GET', '/proposals/' + S.proposalId + '/customer-data')
        .then((view) => { if (isCurrent()) paintCustomerData(view, isCurrent) })
        .catch((err) => { if (isCurrent()) app.innerHTML = '<div class="card"><div class="aviso erro">' + esc(err.message) + '</div></div>' })
    }

    function paintCustomerData(view, isCurrent) {
      const k = view.known
      const f = view.supplement || {}
      const isMissing = (field) => view.missingFields.includes(field)

      // Banco 530: o digito da conta e derivado do proprio numero pela API. Pedir esse campo aqui so
      // confundiria — o valor digitado seria ignorado no envio.
      const bank530 = String(k.bankCode) === '530'

      const identity = [
        { label: 'Nome', value: k.name, wide: true },
        { label: 'Empresa', value: k.employer, wide: true },
        { label: 'Nascimento', value: formatDate(k.birthDate) },
        { label: 'Matrícula', value: k.employeeNumber },
        { label: 'Admissão', value: formatDate(k.hireDate) },
        { label: 'Salário', value: brl(k.salary) },
      ]
      if (k.sex) identity.splice(2, 0, { label: 'Sexo', value: SEX_LABEL[k.sex] || k.sex })

      // Endereco e banco sempre na tela: a base pode vir sem eles, e a API exige o que faltar (RN07).
      app.innerHTML =
        '<div class="card">' +
        '<h1>Complete seu cadastro</h1>' +
        '<p class="hint">Para enviar a proposta, o cadastro de Cliente PF precisa estar completo. Confira o que já sabemos e complete só o que falta.</p>' +
        '<form id="form-dados">' +
        '<h2>Seus dados</h2>' +
        '<div class="grid">' +
        identity.map((i) => '<div class="box' + (i.wide ? ' largo' : '') + '"><div class="rot">' + esc(i.label) + '</div><div class="val">' + esc(i.value) + '</div></div>').join('') +
        (k.phone ? editableBlock('telefone', 'Telefone', formatPhone(k.phone),
          formField('correctedPhone', 'Novo telefone (DDD + número)', textInput('correctedPhone', f.correctedPhone, ' inputmode="numeric"'))) : '') +
        editableBlock('endereco', 'Endereço', addressText(k),
          formField('correctedPostalCode', 'CEP', textInput('correctedPostalCode', f.correctedPostalCode, ' inputmode="numeric"')) +
          formField('correctedStreet', 'Rua', textInput('correctedStreet', f.correctedStreet)) +
          formField('correctedStreetNumber', 'Número', textInput('correctedStreetNumber', f.correctedStreetNumber)),
          ['correctedPostalCode', 'correctedStreet', 'correctedStreetNumber'].some(isMissing)) +
        editableBlock('bancario', 'Dados bancários', bankText(k),
          formField('correctedBankCode', 'Código do banco', textInput('correctedBankCode', f.correctedBankCode)) +
          formField('correctedBankBranch', 'Agência', textInput('correctedBankBranch', f.correctedBankBranch)) +
          formField('correctedBankAccount', 'Conta (sem dígito)', textInput('correctedBankAccount', f.correctedBankAccount)),
          ['correctedBankCode', 'correctedBankBranch', 'correctedBankAccount'].some(isMissing)) +
        '</div>' +
        '<p class="hint">Nome, nascimento, empresa, matrícula, admissão e salário vêm do seu cadastro na empresa — para corrigir, fale com o RH. Telefone, endereço e dados bancários você mesmo altera aqui (a correção fica só nesta jornada, não reescreve a base). O crédito só pode ser depositado em conta b.Uni (banco 530): se a sua conta cadastrada é de outro banco, informe a conta b.Uni.</p>' +

        '<fieldset><legend>Dados pessoais</legend><div class="grid form">' +
        (isMissing('sex') ? formField('sex', 'Sexo', selectInput('sex', f.sex, Object.entries(SEX_LABEL), true), true) : '') +
        formField('nationality', 'Nacionalidade', selectInput('nationality', f.nationality || 'BRAZILIAN', Object.entries(NATIONALITY_LABEL), false), true) +
        formField('motherName', 'Nome da mãe', textInput('motherName', f.motherName), true) +
        formField('maritalStatus', 'Estado civil', selectInput('maritalStatus', f.maritalStatus, Object.entries(MARITAL_STATUS_LABEL), true), true) +
        formField('pep', 'Pessoa politicamente exposta (PEP)?', selectInput('pep', typeof f.pep === 'boolean' ? (f.pep ? 'sim' : 'nao') : '', [['nao', 'Não'], ['sim', 'Sim']], true), true) +
        '</div></fieldset>' +

        '<fieldset><legend>Documento de identificação</legend><div class="grid form">' +
        formField('documentType', 'Tipo de documento', selectInput('documentType', f.documentType || 'RG', [['RG', 'RG'], ['CNH', 'CNH'], ['CIN', 'CIN']], false), true) +
        formField('documentNumber', 'Número do documento', textInput('documentNumber', f.documentNumber), true) +
        formField('documentState', 'UF emissora', textInput('documentState', f.documentState, ' style="text-transform:uppercase"'), true) +
        formField('documentIssuer', 'Órgão emissor', textInput('documentIssuer', f.documentIssuer), true) +
        formField('documentIssueDate', 'Data de emissão', textInput('documentIssueDate', f.documentIssueDate, ' type="date"'), true) +
        '</div></fieldset>' +

        '<fieldset><legend>Endereço</legend><div class="grid form">' +
        formField('city', 'Cidade', textInput('city', f.city), true) +
        formField('state', 'UF', textInput('state', f.state, ' style="text-transform:uppercase"'), true) +
        formField('district', 'Bairro', textInput('district', f.district), true) +
        '</div><p class="hint" id="cep-status"></p></fieldset>' +

        '<fieldset><legend>Dados bancários complementares</legend><div class="grid form">' +
        (bank530
          ? '<p class="hint">Para o banco 530, o dígito da conta é calculado automaticamente a partir do número informado.</p>'
          : formField('accountCheckDigit', 'Dígito da conta', textInput('accountCheckDigit', f.accountCheckDigit))) +
        formField('branchCheckDigit', 'Dígito da agência', textInput('branchCheckDigit', f.branchCheckDigit)) +
        '</div></fieldset>' +

        '<fieldset><legend>Renda</legend><div class="grid form">' +
        formField('otherIncome', 'Renda mensal adicional (R$)', textInput('otherIncome', f.otherIncome, ' inputmode="decimal"')) +
        '</div></fieldset>' +

        alertBox('erro-dados') +
        '<button class="acao" type="submit" id="btn-dados">Continuar</button>' +
        '</form>' +
        '</div>'

      for (const b of document.querySelectorAll('[data-bloco]')) {
        b.onclick = () => {
          const id = b.dataset.bloco
          const editor = document.getElementById('edit-' + id)
          const isOpen = !editor.classList.toggle('oculto')
          document.getElementById('ver-' + id).classList.toggle('oculto', isOpen)
          b.textContent = isOpen ? 'Concluir' : 'Alterar'
        }
      }

      // Busca o endereco pelo CEP no proxy server-side da API — o navegador nunca fala com o ViaCEP.
      const postalCodeInput = document.getElementById('correctedPostalCode')
      postalCodeInput.oninput = async () => {
        const d = postalCodeInput.value.replace(/\D/g, '').slice(0, 8)
        postalCodeInput.value = d
        const status = document.getElementById('cep-status')
        if (d.length !== 8) return
        status.textContent = 'Buscando endereço pelo CEP…'
        try {
          const e = await api('GET', '/postal-codes/' + d)
          status.textContent = ''
          // ViaCEP devolve bairro e rua maiores que o limite da Funcao: corta no maxlength do campo.
          const fill = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = el.maxLength > 0 ? v.slice(0, el.maxLength) : v }
          fill('correctedStreet', e.street)
          fill('district', e.district)
          fill('city', e.city)
          fill('state', e.state)
        } catch (err) {
          status.textContent = err.code === 'CEP_NOT_FOUND'
            ? 'CEP não encontrado — preencha os campos manualmente.'
            : 'Não foi possível consultar o CEP agora — preencha os campos manualmente.'
        }
      }

      // Continuar so grava: o envio a Funcao sai da tela seguinte, por clique explicito.
      const form = document.getElementById('form-dados')
      form.onsubmit = (ev) => {
        ev.preventDefault()
        withButton(document.getElementById('btn-dados'), 'Salvando…', async () => {
          clearError('erro-dados')
          const id = S.proposalId
          try {
            const r = await api('PATCH', '/proposals/' + id + '/customer-data', buildSupplementPayload(readForm(form)))
            if (!r.complete) {
              if (isCurrent()) showError('erro-dados', 'Complete os campos: ' + r.missingFields.map((c) => FIELD_LABEL[c] || c).join(', ') + '.')
              return
            }
            route(await loadProposal(id), isCurrent)
          } catch (err) {
            if (isCurrent()) showError('erro-dados', err.message)
          }
        })
      }
    }

    /* ------------------------------------------------------------- 4 · Envio */

    function reviewScreen(isCurrent) {
      const p = S.proposal
      if (!p) return restart()
      app.innerHTML = '<div class="card"><p class="hint">Carregando sua proposta…</p></div>'

      api('GET', '/proposals/' + S.proposalId + '/customer-data')
        .then((view) => { if (isCurrent()) paintReview(p, view, isCurrent) })
        .catch((err) => { if (isCurrent()) app.innerHTML = '<div class="card"><div class="aviso erro">' + esc(err.message) + '</div></div>' })
    }

    function paintReview(p, view, isCurrent) {
      const k = view.known
      const f = view.supplement || {}
      const o = p.offers.find((x) => x.offerId === p.selectedOfferId)
      // Com o #recusa na tela, o erro do envio vai nele: é o texto da Função que diz o que corrigir.
      const commandMessage = takeNotice()

      app.innerHTML =
        '<div class="card" id="envio">' +
        '<div class="cab-card"><h1>Revise e envie</h1>' + tagStatus(p.status) + '</div>' +
        (p.status === 'ERROR' ? '<div class="aviso erro" id="recusa">' + esc(commandMessage || 'A instituição não aceitou a proposta. Revise seus dados e envie de novo.') + '</div>' : '') +
        alertBox('erro-envio', p.status === 'ERROR' ? null : commandMessage) +
        '<h2>Condição escolhida</h2>' +
        (o ? boxes([{ label: 'Valor liberado', value: brl(o.requestedAmount), highlight: true }]) + offerBoxes(o) : '') +
        '<h2>Seus dados</h2>' +
        boxes([
          { label: 'Nome', value: k.name, wide: true },
          { label: 'Telefone', value: formatPhone(k.phone) },
          { label: 'Documento', value: [f.documentType, f.documentNumber].filter(Boolean).join(' ') || '—' },
          { label: 'Endereço', value: addressText(k) || 'Não informado', wide: true },
          { label: 'Dados bancários', value: bankText(k) || 'Não informado', wide: true },
        ]) +
        '<div class="aviso info">Ao enviar, você autoriza a inclusão da proposta junto ao parceiro bancário. O envio não significa que o crédito foi aprovado.</div>' +
        '<button class="acao coral" id="btn-enviar">Enviar proposta</button><div style="height:10px"></div>' +
        '<button class="acao sec" id="btn-alterar-dados">Alterar dados</button><div style="height:10px"></div>' +
        '<button class="acao sec" id="btn-cancelar">Cancelar proposta</button>' +
        '</div>'

      document.getElementById('btn-alterar-dados').onclick = () => goToStep(3)
      document.getElementById('btn-cancelar').onclick = (ev) => cancelProposal(ev.currentTarget, 'erro-envio', isCurrent)

      // Erro no envio tambem segue o GET: condicao vencida volta re-simulada (Oferta) com a mensagem.
      document.getElementById('btn-enviar').onclick = (ev) => withButton(ev.currentTarget, 'Enviando…', async () => {
        clearError('erro-envio')
        // Voltar ou Alterar dados no meio do envio deixavam o colaborador nos Dados de uma proposta enviada.
        const locked = document.querySelectorAll('#envio button, #btn-voltar')
        for (const b of locked) b.disabled = true
        const id = S.proposalId
        let message = null
        try {
          await api('POST', '/proposals/' + id + '/confirm', { offerId: p.selectedOfferId })
        } catch (err) {
          message = err.message
        }
        try {
          route(await loadProposal(id), isCurrent, { message })
        } catch (err) {
          if (isCurrent()) showError('erro-envio', message || err.message)
        } finally {
          for (const b of locked) b.disabled = false
        }
      })
    }

    /* ------------------------------------------------------ 5 · Confirmação */

    let pollTimer = null
    let pollCount = 0
    let pollStatus = null

    /**
     * Espera ate a proxima atualizacao automatica: 3 s no comeco (retry e inclusao costumam resolver
     * em segundos), depois 15 s, e para. Desfecho desconhecido leva ate ~30 min na conciliacao
     * automatica — polling sem fim so gastaria API. `null` = parou; o botao Atualizar segue funcionando.
     */
    const nextPollDelay = (n) => (n < 10 ? 3000 : n < 30 ? 15000 : null)

    /**
     * UC09 na visao do colaborador. Enquanto nao chega ao resultado (`step` FINISHED) a tela se atualiza
     * sozinha (com backoff) e mantem o Atualizar: na analise, quem muda o status e a Funcao.
     */
    function trackingScreen(isCurrent) {
      clearTimeout(pollTimer)
      const p = S.proposal
      if (!p) return restart()
      if (p.status !== pollStatus) { pollCount = 0; pollStatus = p.status }

      const isFinal = p.step === 'FINISHED'
      const delay = isFinal ? null : nextPollDelay(pollCount)
      const sent = wasSent(p)
      const message = statusMessage(p)
      app.innerHTML =
        '<div class="card" id="acompanhamento">' +
        '<div class="cab-card"><h1>' + (sent ? 'Proposta enviada' : 'Acompanhe sua proposta') + '</h1>' + tagStatus(p.status) + '</div>' +
        (message ? '<div class="aviso ' + (['ERROR', 'REJECTED'].includes(p.status) ? 'erro' : 'info') + '" id="mensagem">' + esc(message) + '</div>' : '') +
        boxes([
          // O "Acompanhar" nao lista inelegivel: o ID nao serviria para nada.
          ...(p.status === 'REJECTED' && !p.employee ? [] : [{ label: 'ID de acompanhamento', value: p.proposalId, mono: true, wide: true, sub: 'Use em "Meus contratos e propostas" ou ao falar com o RH.' }]),
          ...(p.proposalNumber ? [{ label: 'Número da proposta na Função', value: p.proposalNumber }] : []),
        ]) +
        (p.retryScheduledAt ? '<p class="hint">Tentaremos de novo automaticamente às ' + esc(new Date(p.retryScheduledAt).toLocaleTimeString('pt-BR')) + '. Você não precisa refazer nada.</p>' : '') +
        (sent ? '<div class="aviso info">O envio não significa que o crédito foi aprovado. A análise e a decisão são da instituição financeira.</div>' : '') +
        (!isFinal && delay === null ? '<p class="hint" id="poll-parado">Atualização automática pausada. Toque em Atualizar para ver o status.</p>' : '') +
        alertBox('erro-acomp', takeNotice()) +
        (isFinal ? '' : '<button class="acao sec" id="btn-atualizar">Atualizar</button><div style="height:10px"></div>') +
        '<button class="acao" id="btn-nova">Nova consulta</button>' +
        '</div>'

      document.getElementById('btn-nova').onclick = () => { clearTimeout(pollTimer); restart() }
      const refresh = async () => {
        try { route(await loadProposal(), isCurrent) } catch { /* rede: o proximo ciclo (ou o botao) tenta de novo */ }
      }
      const btn = document.getElementById('btn-atualizar')
      if (btn) btn.onclick = () => { pollCount = 0; refresh() }
      if (delay !== null) {
        pollCount++
        pollTimer = setTimeout(() => { if (isCurrent()) refresh() }, delay)
      }
    }

    /* ================================================================== ADMIN */

    /**
     * Portal do backoffice — mesma pagina, em /admin/ ou #admin.
     *
     * So acompanhamento: propostas, origens e funcionarios. Nenhuma tela age sobre proposta — quem a
     * conduz e o colaborador. ATENCAO: a API nao tem nenhum guard; quem alcanca a porta 3010 le tudo
     * isto. Enquanto nao houver perfil de acesso, esta rota so deve existir em rede de desenvolvimento.
     */
    // So vinculos sao lote (planilha unica, via bucket). Empregadores e filiais nao sao lote: vem do
    // catalogo da Funcao (em memoria na API, renovado a cada hora), mostrado na aba "Configuracoes".
    const DATASETS = {
      EMPLOYMENT: { label: 'Vínculos', path: '/admin/employees/batches' },
    }
    // Vocabulario do operador: amarelo enquanto le, verde quando vigente, vermelho com o motivo.
    const BATCH_STATUS_LABEL = {
      PROCESSING: 'Processando',
      PUBLISHED: 'Processado',
      SUPERSEDED: 'Substituído',
      REJECTED: 'Recusado',
      RETRYING: 'Tentando de novo',
      FAILED: 'Falhou',
    }
    // O que o operador faz com a ultima planilha, e a cor do aviso no topo da aba Funcionarios.
    const BATCH_STATUS_HINT = {
      PROCESSING: ['alerta', 'Sendo lida agora.'],
      PUBLISHED: ['ok', 'É a base em uso pela elegibilidade.'],
      SUPERSEDED: ['info', 'Chegou depois de uma planilha mais nova e não entrou em uso.'],
      REJECTED: ['erro', 'O arquivo está errado: corrija a planilha e deposite de novo no bucket.'],
      RETRYING: ['alerta', 'Falhou nesta tentativa; o serviço tenta de novo no próximo ciclo (a cada minuto).'],
      FAILED: ['erro', 'Esgotou as tentativas. Revise o arquivo e, se estiver correto, acione a equipe de T.I.'],
    }
    const batchStatusLabel = (s) => BATCH_STATUS_LABEL[s] || s
    const DATASET_OPTIONS = Object.entries(DATASETS).map(([k, v]) => [k, v.label])
    const DATASET_LABEL = Object.fromEntries(DATASET_OPTIONS)

    /**
     * Backoffice e operacao (proposta e funcionario); Developer e bastidor (outbox, DLQ, carga de lote).
     * As duas visoes sao o mesmo portal com abas diferentes; cada uma lembra a sua aba.
     */
    const PORTAL_TABS = {
      admin: [['propostas', 'Propostas'], ['funcionarios', 'Funcionários'], ['configuracoes', 'Configurações']],
      dev: [['filas', 'Filas'], ['dlq', 'DLQ'], ['lotes', 'Lotes'], ['funcao', 'Função'], ['antifraude', 'Antifraude']],
    }
    const portalTab = { admin: 'propostas', dev: 'filas' }
    let portalMode = 'admin'


    function formatDateTime(iso) {
      return iso ? new Date(iso).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—'
    }

    function renderAdmin() {
      document.getElementById('btn-voltar').classList.add('oculto')

      clearTimeout(queuesTimer)
      const tab = portalTab[portalMode]
      document.getElementById('stepper').innerHTML = PORTAL_TABS[portalMode]
        .map(([id, label]) => '<button class="aba' + (tab === id ? ' ativa' : '') + '" data-aba="' + id + '">' + label + (id === 'dlq' ? '<span class="badge oculto" id="dlq-contagem"></span>' : '') + '</button>').join('')
      for (const b of document.querySelectorAll('[data-aba]')) {
        b.onclick = () => { portalTab[portalMode] = b.dataset.aba; renderAdmin() }
      }
      if (portalMode === 'dev') notifyDlq()

      const isCurrent = newScreen()
      if (tab === 'propostas') proposalsScreen(isCurrent)
      else if (tab === 'filas') queuesScreen(isCurrent)
      else if (tab === 'dlq') dlqScreen(isCurrent)
      else if (tab === 'lotes') batchesScreen(isCurrent)
      else if (tab === 'funcao') funcaoScreen(isCurrent)
      else if (tab === 'antifraude') antifraudScreen(isCurrent)
      else if (tab === 'funcionarios') employeesScreen(isCurrent)
      else settingsScreen(isCurrent)
    }

    // Lista da DLQ paginada; a contagem vem do `meta.total`, exata.
    const DLQ_PER_PAGE = 50

    /** A "notificacao" de DLQ no portal: contagem na aba, sempre que o portal e aberto ou troca de aba. */
    function notifyDlq() {
      api('GET', '/admin/proposals?dlq=true&pageSize=1').then((r) => {
        const el = document.getElementById('dlq-contagem')
        if (!el || r.meta.total === 0) return
        el.textContent = String(r.meta.total)
        el.classList.remove('oculto')
      }).catch(() => { /* a aba continua funcionando sem a contagem */ })
    }

    /* -------------------------------------------------------- Propostas / DLQ */

    /** Rotulo pt-BR com o codigo cru no `title`: a lista fica limpa e o suporte ve o codigo no hover. */
    const titledLabel = (labels, value) => '<span title="' + esc(value) + '">' + esc(labelOf(labels, value)) + '</span>'

    /** Quem abriu a proposta; o nome abre a ficha. Sem matricula: nao chegou a escolher vinculo (inelegivel, indisponivel). */
    const employeeCell = (c) => c
      ? '<button class="link" data-funcionario="' + esc(c.id) + '">' + esc(c.name) + '</button>' +
      '<span class="sub">' + esc(c.cpf) + (c.employeeNumber ? ' · mat. ' + esc(c.employeeNumber) : '') + '</span>'
      : '<span class="sub">CPF fora da base vigente</span>'

    /** Status da spec e, embaixo, a etapa corrente; a tentativa so aparece quando ja houve retry. */
    function statusCell(p) {
      const e = p.currentStep
      return '<span title="' + esc(labelCodeText(INTERNAL_STATUS_LABEL, p.internalStatus)) + '">' + tagStatus(p.status) + '</span>' +
        miniRail(operatorStages(p), p, 'operador') +
        (e ? '<span class="sub">' + esc(STEP_LABEL[e.step] || e.step) + ' · ' + esc(stepStatusLabel(e.status)) + (e.attempt > 1 ? ' · ' + esc(e.attempt) + 'ª tentativa' : '') + '</span>' : '')
    }

    /** So o que existe: motivo, DLQ, retry agendado e, nas incluidas, a esteira (preenchida depois). */
    function detailCell(p) {
      const lines = [
        p.reasonCode && titledLabel(REASON_LABEL, p.reasonCode),
        p.dlq && '<span class="tag REJECTED">DLQ</span>' + (p.dlq.reason && p.dlq.reason !== p.reasonCode ? ' ' + titledLabel(REASON_LABEL, p.dlq.reason) : ''),
        p.retryScheduledAt && '<span class="sub">Retry em ' + esc(formatDateTime(p.retryScheduledAt)) + '</span>',
        p.internalStatus === 'PROPOSAL_CREATED' && '<span class="sub" data-esteira="' + esc(p.proposalId) + '">Função: …</span>',
      ].filter(Boolean)
      return lines.map((l) => '<div>' + l + '</div>').join('')
    }

    function proposalRow(p) {
      return '<tr data-proposta="' + esc(p.proposalId) + '">' +
        '<td>' + employeeCell(p.employee) + '</td>' +
        '<td>' + statusCell(p) + '</td>' +
        '<td>' + detailCell(p) + '</td>' +
        '<td>' + (p.proposalNumber ? 'Nº ' + esc(p.proposalNumber) : '<code>' + esc(p.proposalId.slice(0, 8)) + '</code>') + '<span class="sub">' + esc(formatDateTime(p.updatedAt)) + '</span></td>' +
        '<td><button class="alterar" data-historico="' + esc(p.proposalId) + '">Detalhes</button></td>' +
        '</tr>'
    }

    function proposalsTable(list, emptyText) {
      return list.length
        ? '<table class="tbl lista" id="tbl-propostas"><thead><tr>' +
        '<th>Colaborador</th><th>Status</th><th>Detalhe</th><th>Proposta</th><th></th>' +
        '</tr></thead><tbody>' + list.map(proposalRow).join('') + '</tbody></table>'
        : '<p class="hint">' + emptyText + '</p>'
    }

    function bindHistory() {
      for (const b of document.querySelectorAll('[data-historico]')) {
        b.onclick = () => historyScreen(b.dataset.historico)
      }
      // A ficha aberta da lista volta para a aba de onde saiu.
      for (const b of document.querySelectorAll('[data-funcionario]')) {
        b.onclick = () => employeeScreen(b.dataset.funcionario, renderAdmin)
      }
      // Situacao na esteira so das incluidas, depois de a lista aparecer: a Funcao lenta nao segura a
      // tela. Celula ja fora da tela recebe o texto e ninguem ve. ponytail: uma consulta por incluida
      // da pagina (ate 50, em paralelo); gravar a situacao no banco (catalogo §4.1) se a lista crescer.
      for (const el of document.querySelectorAll('[data-esteira]')) {
        api('GET', '/admin/proposals/' + encodeURIComponent(el.dataset.esteira)).then((h) => {
          const e = h.pipeline
          // A lista vem do status gravado; o detalhe ja traz o da esteira (withPipeline na API).
          const tag = el.closest('tr') && el.closest('tr').querySelector('[data-status]')
          if (tag && h.status !== tag.dataset.status) tag.outerHTML = tagStatus(h.status)
          el.textContent = 'Função: ' + (e
            ? (PIPELINE_STATUS_LABEL[e.status] || e.status) + (e.activityDescription ? ' · ' + e.activityDescription : '')
            : 'sem resposta')
        }).catch(() => { el.textContent = 'Função: sem resposta' })
      }
    }

    /** Rodape de lista paginada (`meta` da API): faixa exibida e Anterior/Proxima. */
    function pager(meta, prefix) {
      const { page, pageSize, total } = meta
      const lastPage = Math.max(1, Math.ceil(total / pageSize))
      return '<div class="cab-card" style="margin-top:12px">' +
        '<span class="hint" style="margin:0">' + ((page - 1) * pageSize + 1) + '–' + Math.min(page * pageSize, total) + ' de ' + total + '</span>' +
        '<span>' +
        '<button class="acao sec" style="width:auto;padding:8px 16px" id="' + prefix + '-anterior"' + (page <= 1 ? ' disabled' : '') + '>Anterior</button> ' +
        '<button class="acao sec" style="width:auto;padding:8px 16px" id="' + prefix + '-proxima"' + (page >= lastPage ? ' disabled' : '') + '>Próxima</button>' +
        '</span>' +
        '</div>'
    }

    /** Liga o pager pintado; `go(page)` busca a pagina pedida. */
    function bindPager(prefix, page, go) {
      const prev = document.getElementById(prefix + '-anterior')
      if (!prev) return
      prev.onclick = () => go(page - 1)
      document.getElementById(prefix + '-proxima').onclick = () => go(page + 1)
    }

    /** Filtros: so os preenchidos (vazio quebraria a validacao de enum/data na API). */
    const filled = (f) => Object.fromEntries(Object.entries(f).filter(([, v]) => v))
    const queryFiltros = (f) => new URLSearchParams(filled(f)).toString()

    const filterOptions = (allLabel, labels) => '<option value="">' + allLabel + '</option>' +
      Object.entries(labels).map(([v, r]) => '<option value="' + esc(v) + '">' + esc(r) + '</option>').join('')

    /** Fecha a linha de filtros, alinhado com os campos. `type="button"` para nao submeter o form. */
    const clearButton = (id) => '<button type="button" class="acao sec" id="' + id + '" style="flex:0 0 160px;align-self:flex-end">Limpar filtros</button>'

    const PROPOSALS_PER_PAGE = 50

    function proposalsScreen(isCurrent) {
      app.innerHTML =
        '<div class="card">' +
        '<h1>Propostas</h1>' +
        '<p class="hint">Status na visão do colaborador e a etapa em que cada uma está; passe o mouse no status ou no motivo para ver o código interno. Para dar suporte, busque pelo CPF ou abra o histórico pelo id que o colaborador informar.</p>' +
        '<div class="linha" style="margin-bottom:14px">' +
        '<input id="busca-id" placeholder="id da proposta (uuid)" spellcheck="false">' +
        '<button class="acao" id="btn-busca" style="flex:0 0 160px">Abrir histórico</button>' +
        '</div>' +
        alertBox('erro-busca') +
        '<div class="linha" id="filtros-propostas" style="margin-bottom:14px">' +
        formField('f-cpf', 'CPF', '<input id="f-cpf" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="000.000.000-00">') +
        formField('f-status', 'Status', '<select id="f-status">' + filterOptions('Todos', STATUS_LABEL) + '</select>') +
        formField('f-step', 'Etapa atual', '<select id="f-step">' + filterOptions('Todas', STEP_LABEL) + '</select>') +
        formField('f-from', 'Criadas de', '<input type="date" id="f-from">') +
        formField('f-to', 'Até', '<input type="date" id="f-to">') +
        clearButton('limpar-propostas') +
        '</div>' +
        '<div id="stats-propostas"></div>' +
        '<p class="hint">Contagem por status no período e etapa filtrados; status e CPF valem só para a lista.</p>' +
        '<div id="lista-propostas"><p class="hint">Carregando…</p></div>' +
        '</div>'

      document.getElementById('btn-busca').onclick = () => {
        const id = document.getElementById('busca-id').value.trim()
        if (id) historyScreen(id)
      }

      // Filtro trocado rapido: so a resposta da ultima troca pinta a tela. Filtro novo volta a pagina 1.
      let requestSeq = 0
      let page = 1
      const load = () => {
        const mine = ++requestSeq
        const current = () => isCurrent() && mine === requestSeq
        const value = (id) => document.getElementById(id).value
        const f = { step: value('f-step'), from: value('f-from'), to: value('f-to') }
        clearError('erro-busca')
        api('GET', '/admin/proposals/stats?' + queryFiltros(f)).then((s) => {
          if (!current()) return
          document.getElementById('stats-propostas').innerHTML = boxes([
            { label: 'Total', value: s.total, highlight: true },
            ...s.byStatus.map((p) => ({ label: STATUS_LABEL[p.status] || p.status, value: p.count, sub: p.percentage.toLocaleString('pt-BR') + '%' })),
          ])
        }).catch((err) => { if (current()) showError('erro-busca', err.message) })
        const cpf = value('f-cpf').replace(/\D/g, '')
        if (cpf && cpf.length !== 11) return showError('erro-busca', 'Informe os 11 dígitos do CPF.')
        const listFilters = filled({ page, pageSize: PROPOSALS_PER_PAGE, status: value('f-status'), ...f })
        // CPF no corpo, nunca na URL (RF-SEC-001): com CPF a lista vem do POST de leitura.
        const list = cpf
          ? api('POST', '/admin/proposals/lookup', { cpf, ...listFilters })
          : api('GET', '/admin/proposals?' + new URLSearchParams(listFilters))
        list.then((r) => {
          if (!current()) return
          document.getElementById('lista-propostas').innerHTML = proposalsTable(r.proposals, 'Nenhuma proposta com esses filtros.') +
            (r.proposals.length ? pager(r.meta, 'prop') : '')
          bindHistory()
          bindPager('prop', r.meta.page, (n) => { page = n; load() })
        }).catch((err) => { if (current()) showError('erro-busca', err.message) })
      }
      const filters = ['f-cpf', 'f-status', 'f-step', 'f-from', 'f-to']
      for (const id of filters) document.getElementById(id).onchange = () => { page = 1; load() }
      // CPF aplica no Enter (o blur dispara o `change`) ou ao sair do campo.
      const cpfInput = document.getElementById('f-cpf')
      cpfInput.oninput = () => { cpfInput.value = maskCpf(cpfInput.value) }
      cpfInput.onkeydown = (ev) => { if (ev.key === 'Enter') cpfInput.blur() }
      document.getElementById('limpar-propostas').onclick = () => {
        for (const id of filters) document.getElementById(id).value = ''
        page = 1
        load()
      }
      load()
    }

    /** "Notificado quando uma proposta cair em DLQ": a aba mostra a contagem e esta e a fila. */
    function dlqScreen(isCurrent, page = 1) {
      app.innerHTML = '<div class="card"><p class="hint">Carregando…</p></div>'
      api('GET', '/admin/proposals?dlq=true&pageSize=' + DLQ_PER_PAGE + '&page=' + page).then((r) => {
        if (!isCurrent()) return
        app.innerHTML =
          '<div class="card" id="dlq">' +
          '<h1>Falhas definitivas (DLQ)</h1>' +
          '<p class="hint">Propostas em erro definitivo: retentativas esgotadas ou rejeição da Função. São alçada do backoffice — confira o histórico e trate com o colaborador. A matrícula já está livre: uma nova simulação abre outra proposta.</p>' +
          proposalsTable(r.proposals, 'Nenhuma proposta na DLQ.') +
          (r.proposals.length ? pager(r.meta, 'dlq') : '') +
          '</div>'
        bindHistory()
        bindPager('dlq', r.meta.page, (n) => dlqScreen(newScreen(), n))
      }).catch((err) => {
        if (!isCurrent()) return
        app.innerHTML = '<div class="card"><div class="aviso erro">' + esc(err.message) + '</div></div>'
      })
    }

    /* ------------------------------------------------------------------ Filas */

    /**
     * O que esta em background agora, a partir da mesma lista do backoffice: fila de retry do outbox
     * (falha transitoria com reprocessamento agendado), inclusoes em curso ou esperando conciliacao,
     * cadastros parados e DLQ. Agrupar e contar, nunca somar valor.
     */
    function queuesSummary(list) {
      const byStatus = {}
      for (const p of list) byStatus[p.internalStatus] = (byStatus[p.internalStatus] || 0) + 1
      return {
        total: list.length,
        retry: list.filter((p) => p.retryScheduledAt).sort((a, b) => (a.retryScheduledAt < b.retryScheduledAt ? -1 : 1)),
        // Erro retentavel SEM evento no outbox: ninguem vai reprocessar sozinho (conciliacao "nao criada",
        // falha nao transitoria da inclusao). Depende do colaborador reconfirmar ou cancelar.
        stalled: list.filter((p) => p.internalStatus === 'ERROR_RETRYABLE' && !p.retryScheduledAt),
        submitting: list.filter((p) => p.internalStatus === 'SUBMITTING'),
        awaitingData: list.filter((p) => p.internalStatus === 'CONDITION_SELECTED'),
        dlq: list.filter((p) => p.dlq),
        byInternalStatus: Object.entries(byStatus).sort((a, b) => b[1] - a[1]),
      }
    }

    let queuesTimer = null
    // ponytail: amostra das 200 propostas mais recentes (teto do GET /admin/proposals). Um evento de
    // outbox mais antigo que isso nao aparece aqui — pede um endpoint de fila (ver relatorio).
    const QUEUE_SAMPLE = 200
    const QUEUES_REFRESH_MS = 5000

    /** `vigente` e o da aba: o refresh so repinta (e so religa o timer) enquanto a aba Filas e a tela. */
    function queuesScreen(isCurrent) {
      clearTimeout(queuesTimer)
      if (!document.getElementById('filas')) app.innerHTML = '<div class="card"><p class="hint">Carregando…</p></div>'
      const reschedule = () => { queuesTimer = setTimeout(() => { if (isCurrent()) queuesScreen(isCurrent) }, QUEUES_REFRESH_MS) }
      // A DLQ vem da propria consulta filtrada: na amostra das recentes ela sairia subcontada.
      Promise.all([
        api('GET', '/admin/proposals?pageSize=' + QUEUE_SAMPLE),
        api('GET', '/admin/proposals?dlq=true&pageSize=' + QUEUE_SAMPLE),
      ]).then(([r, dlq]) => {
        if (!isCurrent()) return
        const f = queuesSummary(r.proposals)
        f.dlq = dlq.proposals
        const dlqTotal = String(dlq.meta.total)
        const section = (title, list, emptyText, hint) =>
          '<h2 style="margin-top:18px">' + title + ' (' + list.length + ')</h2>' + (hint ? '<p class="hint">' + hint + '</p>' : '') + proposalsTable(list, emptyText)
        app.innerHTML =
          '<div class="card" id="filas">' +
          '<h1>Filas em background</h1>' +
          '<p class="hint">A saga grava cada etapa em <code>proposal_step</code>; falha transitória grava a etapa e um evento no <code>outbox_event</code> na mesma transação. O worker do próprio processo (<code>@Cron</code> a cada 5 s) reserva os eventos vencidos com <code>FOR UPDATE SKIP LOCKED</code> e retoma a saga do ponto em que parou, com backoff exponencial. Esgotou <code>RETRY_MAX_ATTEMPTS</code> = DLQ.</p>' +
          '<p class="hint" id="filas-atualizacao">Atualiza a cada 5 s · última às ' + esc(new Date().toLocaleTimeString('pt-BR')) + '</p>' +
          boxes([
            { label: 'Retry agendado', value: f.retry.length, highlight: true },
            { label: 'Erro sem retry', value: f.stalled.length },
            { label: 'Inclusão em curso / conciliação', value: f.submitting.length },
            { label: 'Aguardando cadastro', value: f.awaitingData.length },
            { label: 'DLQ', value: dlqTotal },
          ]) +
          '<p class="hint">Amostra: as ' + f.total + ' propostas mais recentes. Por estado interno: ' +
          f.byInternalStatus.map(([st, n]) => esc(labelOf(INTERNAL_STATUS_LABEL, st)) + ' <code>' + esc(st) + '</code> ' + n).join(' · ') + '</p>' +
          section('Fila de retry (outbox)', f.retry, 'Nenhum reprocessamento agendado.',
            'Falha que com certeza não chegou à Função (rede, token). O worker reprocessa sozinho no horário da coluna Retry — nada a fazer.') +
          section('Erro sem retry agendado', f.stalled, 'Nenhuma proposta parada em erro.',
            'ERROR_RETRYABLE sem evento no outbox (conciliação "não criada" ou falha não transitória da inclusão): ninguém reprocessa sozinho. O colaborador reconfirma ou cancela pela tela dele.') +
          section('Inclusão em curso ou desfecho desconhecido', f.submitting, 'Nenhuma inclusão em andamento.',
            'SUBMITTING: a chamada está no ar, ou deu timeout e a Função pode ter criado a proposta. Desfecho desconhecido nunca é reenviado às cegas: o serviço procura a proposta na Função a cada minuto e concilia sozinho.') +
          section('Aguardando cadastro do colaborador', f.awaitingData, 'Nenhuma proposta parada no cadastro.',
            'Cliente PF incompleto (RN07): depende do colaborador completar os dados e confirmar de novo.') +
          '<h2 style="margin-top:18px">DLQ (' + dlqTotal + ')</h2>' +
          '<p class="hint">Lista completa na aba DLQ. Não há reprocessamento de DLQ pela API: a matrícula já está livre, e o colaborador refaz a simulação pelo CPF.</p>' +
          '</div>'
        bindHistory()
        reschedule()
      }).catch((err) => {
        if (!isCurrent()) return
        // Falha de rede nao derruba o refresh em silencio: avisa e continua tentando no mesmo ritmo.
        const line = document.getElementById('filas-atualizacao')
        const msg = 'Falha ao atualizar (' + err.message + '). Nova tentativa em 5 s.'
        if (line) { line.textContent = msg; line.classList.add('fail') }
        else app.innerHTML = '<div class="card"><div class="aviso erro">' + esc(msg) + '</div></div>'
        reschedule()
      })
    }

    /* --------------------------------------------------------------- Detalhes */

    const pct = (n) => (n == null ? '—' : n.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '%')
    const money = (n) => (n == null ? '—' : brl(n))
    const codeAndName = (o) => (o ? [o.code, o.name].filter(Boolean).join(' · ') : '') || '—'

    /**
     * Proposta como a Funcao a guarda (`GET /Proposta/Detalhada`, consultada a cada abertura): o que o
     * colaborador escolheu e preencheu, ja do lado de la. Valores ecoados, nada calculado aqui.
     */
    function funcaoDetail(f) {
      if (!f) return '<div id="funcao-detalhe"><p class="hint">A Função não devolveu esta proposta: ainda não foi incluída ou a consulta falhou agora.</p></div>'
      const c = f.credit, k = f.customer, d = f.disbursement, a = k && k.address, phone = k && k.mobilePhone
      return '<div id="funcao-detalhe">' +
        (c ? '<h2>Condição de crédito</h2>' + boxes([
          { label: 'Valor solicitado', value: money(c.requestedAmount), highlight: true },
          { label: 'Valor líquido', value: money(c.netAmount) },
          { label: 'Parcelas', value: c.installments ? c.installments + ' × ' + money(c.installmentAmount) : '—' },
          { label: 'Valor bruto', value: money(c.grossAmount) },
          { label: 'Principal', value: money(c.principalAmount) },
          { label: 'IOF', value: money(c.iofAmount) },
          { label: 'CET', value: pct(c.monthlyCet) + ' a.m.', sub: pct(c.yearlyCet) + ' a.a.' },
          { label: 'Taxa nominal', value: pct(c.monthlyRate) + ' a.m.', sub: pct(c.yearlyRate) + ' a.a.' },
          { label: 'Data base', value: formatDate(c.baseDate) },
          { label: 'Vencimentos', value: formatDate(c.firstDueDate) + ' a ' + formatDate(c.lastDueDate) },
        ]) : '') +
        (k ? '<h2>Dados do colaborador</h2>' + boxes([
          { label: 'Nome', value: orDash(k.name), wide: true },
          { label: 'Matrícula', value: orDash(k.employeeNumber) },
          { label: 'Sexo', value: k.sex ? SEX_LABEL[k.sex] || k.sex : '—' },
          { label: 'Estado civil', value: k.maritalStatus ? MARITAL_STATUS_LABEL[k.maritalStatus] || k.maritalStatus : '—' },
          { label: 'Nascimento', value: formatDate(k.birthDate) },
          { label: 'Documento', value: [k.documentType, k.documentNumber].filter(Boolean).join(' ') || '—' },
          { label: 'Celular', value: phone ? formatPhone((phone.areaCode || '') + (phone.number || '')) : '—' },
          {
            label: 'Endereço', wide: true, value: a
              ? [[a.street, a.number, a.complement].filter(Boolean).join(', '), a.district, [a.city, a.state].filter(Boolean).join('/')].filter(Boolean).join(' — ') + (a.postalCode ? ' — CEP ' + formatPostalCode(a.postalCode) : '')
              : '—'
          },
        ]) : '') +
        (d ? '<h2>Conta de crédito</h2>' + boxes([
          { label: 'Favorecido', value: orDash(d.beneficiaryName), wide: true },
          { label: 'Banco', value: orDash(d.bankCode) },
          { label: 'Agência', value: [d.branchNumber, d.branchCheckDigit].filter(Boolean).join('-') || '—' },
          { label: 'Conta', value: [d.accountNumber, d.accountCheckDigit].filter(Boolean).join('-') || '—' },
          { label: 'Valor liberado', value: money(d.amount) },
        ]) : '') +
        '<h2>Convênio e origem</h2>' + boxes([
          { label: 'Convênio', value: codeAndName(f.agreement) },
          { label: 'Produto', value: codeAndName(f.product) },
          { label: 'Empregador (Origem4)', value: codeAndName(f.channel) },
          { label: 'Filial (Origem5)', value: codeAndName(f.branch) },
        ]) +
        '</div>'
    }

    /**
     * Desfecho desconhecido da inclusao: SUBMITTING com a etapa INCLUSION parada em
     * PROPOSAL_OUTCOME_UNKNOWN. O servico concilia sozinho na Funcao; SUBMITTING sem esse marcador e
     * chamada em curso.
     */
    const awaitsReconciliation = (h) => h.internalStatus === 'SUBMITTING' &&
      h.steps.some((e) => e.step === 'INCLUSION' && e.status === 'PENDING' && e.reasonCode === 'PROPOSAL_OUTCOME_UNKNOWN')

    /**
     * O que esta acontecendo com a proposta, em linguagem de suporte. So leitura: o backoffice nao age
     * sobre proposta — quem conduz e o colaborador, e o desfecho desconhecido se resolve sozinho.
     */
    function supportNote(h) {
      if (awaitsReconciliation(h)) return 'Desfecho desconhecido: o envio não teve resposta. O serviço procura a proposta na Função a cada minuto — achou, vira incluída; sem sinal dela em 30 minutos, volta ao colaborador para reenviar.'
      if (h.internalStatus === 'FAILED_PERMANENT') return 'DLQ: não há reprocessamento. A matrícula já está livre — uma nova simulação pelo CPF abre outra proposta.'
      if (h.internalStatus === 'ERROR_RETRYABLE') return (h.retries || []).some((r) => !r.processedAt && !r.deadAt)
        ? 'Retry agendado no outbox: o worker reprocessa sozinho.'
        : 'Falha sem retry agendado: o colaborador tenta de novo ou cancela pela tela dele.'
      if (h.internalStatus === 'UNAVAILABLE') return 'Indisponível por dado de referência: confira se há lote de vínculos vigente (Developer › Lotes; a planilha chega pela caixa de entrada do bucket) ou se a filial está cadastrada (aba Configurações); a proposta volta a andar quando o colaborador refizer a simulação pelo CPF.'
      if (h.internalStatus === 'SUBMITTING') return 'Inclusão em curso na Função.'
      return ''
    }

    /**
     * Linha do tempo do backoffice (saga e antifraude): uma linha por etapa, com o estado no trilho
     * da primeira coluna e, enquanto a proposta anda, as linhas "agora" e "proximo" no fim.
     */
    const timelineTable = (headers, rows) => '<div class="rolagem"><table class="tbl timeline"><thead><tr><th class="tl-mark"><span class="sr-only">Situação</span></th>' +
      headers.map((c) => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>'
    const TL_MARK = '<td class="tl-mark" aria-hidden="true"><span></span></td>'
    // Linha que nao veio do banco (agora, proximo, resultado): nome, recado e o resto num colspan.
    const timelineExtra = (cls, name, note, rest, span) =>
      '<tr class="' + cls + '">' + TL_MARK + '<td>' + esc(name) + '</td><td><span class="tl-now">' + esc(note) + '</span></td><td colspan="' + span + '">' + (rest || '') + '</td></tr>'

    const SAGA_ORDER = Object.keys(STEP_LABEL)
    const SAGA_STATE = { SUCCEEDED: 'concluida', PENDING: 'atual', FAILED: 'falha' }
    // Proposta parada esperando o colaborador: o que falta ele fazer para a saga seguir.
    const WAITS_EMPLOYEE = {
      OFFER: 'Espera o colaborador escolher a oferta.',
      CUSTOMER_DATA: 'Espera o colaborador completar os dados.',
      SUBMISSION: 'Espera o colaborador enviar a proposta.',
    }

    /** A proxima etapa e quem a destrava; nada quando encerrou ou falhou (a orientacao explica). */
    function sagaNext(h) {
      if (h.step === 'FINISHED') return null
      if (h.proposalNumber) return { name: 'Resultado', note: 'A Função aprova ou recusa; o espelho da esteira se atualiza sozinho.' }
      const last = h.steps[h.steps.length - 1]
      if (last && last.status === 'FAILED') return null
      const step = SAGA_ORDER.find((s) => !h.steps.some((e) => e.step === s))
      if (!step) return { name: 'Análise na Função', note: 'Começa quando a inclusão termina.' }
      return { name: STEP_LABEL[step], note: (h.status === 'NOT_SUBMITTED' && WAITS_EMPLOYEE[h.step]) || 'Segue sozinha, sem ação de ninguém.' }
    }

    /** Etapas gravadas da saga e, depois da inclusao, a analise e o resultado da Funcao (esteira). */
    function sagaRows(h) {
      const rows = h.steps.map((e) => {
        const state = SAGA_STATE[e.status] || 'concluida'
        const label = esc(stepStatusLabel(e.status))
        return '<tr class="' + state + (state === 'atual' ? ' by-service' : '') + '" data-etapa="' + esc(e.step) + '" data-etapa-status="' + esc(e.status) + '">' + TL_MARK +
          '<td>' + esc(STEP_LABEL[e.step] || e.step) + '</td>' +
          '<td>' + (state === 'concluida' ? label : '<span class="tl-now">' + (state === 'atual' ? 'Agora · ' : '') + label + '</span>') + '</td>' +
          '<td class="num">' + esc(e.attempt) + '</td><td>' + reasonLabel(e.reasonCode) + '</td><td>' + esc(formatDateTime(e.startedAt)) + '</td><td>' + esc(formatDateTime(e.finishedAt)) + '</td></tr>'
      })
      if (h.proposalNumber) {
        const finished = h.step === 'FINISHED'
        const pipeline = h.pipeline ? esc(PIPELINE_STATUS_LABEL[h.pipeline.status] || h.pipeline.status) + (h.pipeline.activityDescription ? ' — ' + esc(h.pipeline.activityDescription) : '') : ''
        rows.push(timelineExtra(finished ? 'concluida' : 'atual by-institution', 'Análise na Função', finished ? 'concluída' : 'Agora · com a Função', pipeline, 4))
        if (finished) rows.push(timelineExtra(FINISHED_STATE[h.status] || 'concluida', 'Resultado', STATUS_LABEL[h.status] || h.status, '', 4))
      }
      const next = sagaNext(h)
      if (next) rows.push(timelineExtra('proxima', next.name, 'Próximo', esc(next.note), 4))
      return rows
    }

    const ANTIFRAUD_EVENT_STATE = { FAILED: 'falha', POSTPONED: 'adiada' }
    // Triagem em curso: o que o servico faz agora e o que vem depois.
    const ANTIFRAUD_FLOW = {
      REQUESTED: ['Criar a transação na Certta', 'Veredito da Certta'],
      PROCESSING: ['Veredito da Certta', 'Observação na Função'],
      DECIDED: ['Observação na Função', null],
    }

    /**
     * Triagem Certta da proposta incluida: estado, o texto gravado na Funcao, a linha do tempo e as
     * observacoes que a Funcao tem de fato (lidas na hora). `null` = triagem desligada ou nao incluida.
     */
    function antifraudBox(h) {
      const a = h.antifraud
      const head = '<h2 class="secao">Antifraude — Certta</h2>'
      if (!a) return head + '<p class="hint" id="antifraude">Sem triagem: a triagem está desligada ou a proposta ainda não foi incluída na Função.</p>'
      const table = (headers, rows) => '<div class="rolagem"><table class="tbl"><thead><tr>' + headers.map((x) => '<th>' + x + '</th>').join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>'
      const detail = (e) => [
        e.certtaStatus && labelWithCode(CERTTA_LABEL, e.certtaStatus),
        e.reason && reasonLabel(e.reason),
        e.noteText && '<span class="sub">“' + esc(e.noteText) + '”</span>',
      ].filter(Boolean).join(' ') || '—'
      const notes = h.funcaoNotes
      const flow = ANTIFRAUD_FLOW[a.status]
      const events = a.events.map((e) =>
        '<tr class="' + (ANTIFRAUD_EVENT_STATE[e.type] || 'concluida') + '" data-antifraude-evento="' + esc(e.type) + '">' + TL_MARK +
        '<td>' + labelWithCode(ANTIFRAUD_EVENT_LABEL, e.type) + '</td><td class="quebra">' + detail(e) + '</td><td>' + esc(formatDateTime(e.occurredAt)) + '</td></tr>')
      const timeline = flow
        ? [...events,
        timelineExtra('atual by-service', flow[0], 'Agora · com o serviço', a.nextCheckAt ? 'próxima consulta em ' + esc(formatDateTime(a.nextCheckAt)) : '', 1),
        ...(flow[1] ? [timelineExtra('proxima', flow[1], 'Próximo', '', 1)] : [])]
        : events
      return head + '<div id="antifraude" data-antifraude-status="' + esc(a.status) + '">' +
        boxes([
          codeBox('Situação', ANTIFRAUD_CHECK_STATUS_LABEL, a.status),
          { label: 'Veredito', value: a.verdict ? ANTIFRAUD_VERDICT_LABEL[a.verdict] || a.verdict : '—', sub: a.decidedAt && formatDateTime(a.decidedAt) },
          { label: 'Indício de fraude', value: a.fraud == null ? '—' : (a.fraud ? 'Sim' : 'Não') },
          codeBox('Status na Certta', CERTTA_LABEL, a.certtaStatus),
          { label: 'Motivos', value: certtaReasons(a.reasons) },
          { label: 'Transação', value: orDash(a.transactionId) },
          { label: a.status === 'PROCESSING' ? 'Consultas sem veredito' : 'Tentativas nesta etapa', value: String(a.attempts), sub: a.nextCheckAt ? 'próxima em ' + formatDateTime(a.nextCheckAt) : 'encerrada' },
          codeBox('Última falha', REASON_LABEL, a.lastError),
        ]) +
        (a.noteText ? '<div class="aviso info">Gravado na Função em ' + esc(formatDateTime(a.recordedAt)) + ': “' + esc(a.noteText) + '”</div>' : '') +
        (a.transactionId ? '<button class="acao sec" id="btn-certta" data-tx="' + esc(a.transactionId) + '" style="margin:6px 0 4px">Ver transação na Certta (Developer)</button>' : '') +
        '<h3>Linha do tempo</h3>' +
        (timeline.length ? timelineTable(['Etapa', 'Detalhe', 'Quando'], timeline) : '<p class="hint">Nada registrado.</p>') +
        '<h3>Observações na Função (lidas agora)</h3>' +
        (notes == null ? '<p class="hint">A Função não devolveu as observações (fora do ar ou recusou a consulta).</p>'
          : notes.length ? table(['Tipo', 'Cabeçalho', 'Texto'], notes.map((n) => '<tr><td>' + esc(orDash(n.type)) + '</td><td>' + esc(orDash(n.header)) + '</td><td class="quebra">' + esc(n.text) + '</td></tr>'))
            : '<p class="hint">Nenhuma observação na proposta.</p>') +
        '</div>'
    }

    function historyScreen(id) {
      clearTimeout(queuesTimer)
      const isCurrent = newScreen()
      app.innerHTML = '<div class="card"><p class="hint">Carregando detalhes…</p></div>'
      api('GET', '/admin/proposals/' + encodeURIComponent(id)).then((h) => {
        if (!isCurrent()) return
        const table = (headers, rows) => rows.length
          ? '<div class="rolagem"><table class="tbl"><thead><tr>' + headers.map((c) => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>'
          : '<p class="hint">Nada registrado.</p>'
        const c = h.employee
        app.innerHTML =
          '<div class="card" id="historico" data-proposta="' + esc(h.proposalId) + '">' +
          '<div class="cab-card"><h1>Proposta ' + (h.proposalNumber ? 'nº ' + esc(h.proposalNumber) : '<code>' + esc(h.proposalId.slice(0, 8)) + '</code>') + '</h1>' + tagStatus(h.status) + '</div>' +
          '<div class="detail-rail">' + railHtml(operatorStages(h), h, 'operador') + '</div>' +
          boxes([
            { label: 'Número na Função', value: orDash(h.proposalNumber) },
            { label: 'Id', value: h.proposalId, mono: true },
            { label: 'Colaborador', value: c ? c.name : 'fora da base vigente', sub: c && c.cpf },
            { label: 'Matrícula', value: orDash(c && c.employeeNumber) },
            { label: 'Empregador', value: orDash(c && c.tradeName) },
            codeBox('Estado interno', INTERNAL_STATUS_LABEL, h.internalStatus),
            codeBox('Motivo técnico', REASON_LABEL, h.reasonCode),
          ]) +
          pipelineBox(h.pipeline) +
          antifraudBox(h) +
          (supportNote(h) ? '<div class="aviso info" id="orientacao">' + esc(supportNote(h)) + '</div>' : '') +
          funcaoDetail(h.funcao) +
          '<h2 class="secao">Histórico</h2>' +
          '<h3>Etapas da saga</h3>' +
          timelineTable(['Etapa', 'Status', 'Tentativa', 'Motivo', 'Início', 'Fim'], sagaRows(h)) +
          '<h3>Reprocessamentos (outbox)</h3>' +
          table(['Tipo', 'Leituras do worker', 'Disponível em', 'Processado', 'DLQ', 'Último erro'], h.retries.map((r) =>
            '<tr><td>' + labelWithCode(EVENT_LABEL, r.type) + '</td><td class="num">' + esc(r.workerAttempts) + '</td><td>' + esc(formatDateTime(r.availableAt)) + '</td><td>' + esc(formatDateTime(r.processedAt)) + '</td><td>' + esc(formatDateTime(r.deadAt)) + '</td><td>' + reasonLabel(r.lastError) + '</td></tr>')) +
          '<h3>Envios à Função</h3>' +
          table(['Status', 'Proposta Função', 'Motivo (como a Função devolveu)', 'Em'], (h.submissions || []).map((s) =>
            '<tr data-envio-status="' + esc(s.status) + '"><td>' + esc(stepStatusLabel(s.status)) + '</td><td>' + esc(s.proposalNumber || '—') + '</td><td>' + reasonLabel(s.errorCode) + '</td><td>' + esc(formatDateTime(s.createdAt)) + '</td></tr>')) +
          '<div style="height:14px"></div>' +
          '<div class="linha"><button class="acao sec" id="btn-voltar-lista">Voltar</button>' +
          (c ? '<button class="acao" id="btn-ficha">Ver ficha do colaborador</button>' : '') + '</div>' +
          '</div>'

        document.getElementById('btn-voltar-lista').onclick = () => renderAdmin()
        const certta = document.getElementById('btn-certta')
        if (certta) certta.onclick = () => { pendingAntifraudTx = certta.dataset.tx; portalTab.dev = 'antifraude'; location.hash = '#dev' }
        if (c) document.getElementById('btn-ficha').onclick = () => employeeScreen(c.id, () => historyScreen(id))
      }).catch((err) => {
        if (!isCurrent()) return

    /**

    function funcaoScreen(isCurrent) {
      const input = (id, label, extra) => formField(id, label, '<input id="' + id + '" spellcheck="false"' + (extra || '') + '>')
      const form = (id, fields) => '<form id="' + id + '" class="linha" style="margin-bottom:10px">' + fields + '<button class="acao" style="flex:0 0 120px">Buscar</button></form>'
      app.innerHTML =
        '<div class="card"><h1>Função — cadastro</h1><p class="hint">Consultas de leitura no ambiente da Função (HML). Sem filtro, lista a primeira página.</p>' +

        '<div class="card"><h2>Empregadores (Origem4)</h2>' +
        form('form-emp', input('fe-code', 'Código') + input('fe-desc', 'Descrição') + input('fe-cnpj', 'CNPJ') +

        form('form-fil', input('ff-code', 'Código') + input('ff-desc', 'Descrição') + input('ff-cnpj', 'CNPJ') + input('ff-emp', 'Origem4')) +
        '<div id="res-fil"></div></div>' +
        '<div class="card"><h2>Funcionários</h2><p class="hint">Por CPF ou matrícula; sem nenhum dos dois, lista o empregador.</p>' +
        form('form-fun', input('fu-cpf', 'CPF') + input('fu-mat', 'Matrícula') + input('fu-emp', 'Origem4 (empregador)') + input('fu-fil', 'Origem5 (filial)')) +
        '<div id="res-fun"></div></div>' +
        '<div class="card"><h2>Esteira — aprovar proposta</h2><p class="hint">Aciona a esteira da Função com <strong>Aprovar</strong> para a proposta já incluída (efeito real no ambiente da Função; recusado em produção). Só a esteira em <em>Integrada</em> conta como contrato ativo.</p>' +
        '<form id="form-aprovar" class="linha" style="margin-bottom:10px">' + input('ap-id', 'ID da proposta') + '<button class="acao" style="flex:0 0 120px">Aprovar</button></form>' +
        '<div id="res-aprovar"></div></div>'

      const val = (id) => document.getElementById(id).value.trim()
      const run = (formId, resId, fetcher, render) => {
        document.getElementById(formId).onsubmit = async (ev) => {
          ev.preventDefault()
          clearError('erro-funcao')
          const target = document.getElementById(resId)
          target.innerHTML = '<p class="hint">Consultando…</p>'
          try {
            const r = await fetcher()
            if (isCurrent()) target.innerHTML = render(r)
          } catch (err) {
            if (isCurrent()) { target.innerHTML = ''; showError('erro-funcao', err.message) }
          }
        }
      }
      const table = (head, rows, r) => '<p class="hint">' + esc(r.total) + ' registro(s)' + (r.pages > 1 ? ' · ' + esc(r.pages) + ' páginas (mostrando a 1ª)' : '') + '</p>' +
        (rows.length ? '<div class="rolagem"><table class="tbl"><thead><tr>' + head.map((h) => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map((c) => '<tr>' + c.map((x) => '<td>' + esc(x ?? '—') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>' : '')
      const qs = (o) => new URLSearchParams(Object.entries(o).filter(([, v]) => v)).toString()

      run('form-emp', 'res-emp', () => api('GET', '/admin/funcao/employers?' + qs({
        code: val('fe-code'), description: val('fe-desc'), cnpj: val('fe-cnpj'), status: val('fe-status'),
      })), (r) => table(['Código', 'Descrição', 'Situação'], r.origins.map((o) => [o.code, o.description, o.status && (FUNCAO_ORIGIN_STATUS_LABEL[o.status] || o.status)]), r))

      run('form-fil', 'res-fil', () => api('GET', '/admin/funcao/branches?' + qs({
        code: val('ff-code'), description: val('ff-desc'), cnpj: val('ff-cnpj'), employer: val('ff-emp'),
      })), (r) => table(['Código', 'Descrição', 'CNPJ', 'Empregador'], r.origins.map((o) => [o.code, o.description, o.cnpj, o.employer ? o.employer.code + ' · ' + o.employer.description : null]), r))

      run('form-fun', 'res-fun', () => api('POST', '/admin/employees/funcao/lookup', Object.fromEntries(Object.entries({
        cpf: val('fu-cpf'), employeeNumber: val('fu-mat'), origin4: val('fu-emp'), origin5: val('fu-fil'),
      }).filter(([, v]) => v))), (r) => table(['Nome', 'CPF', 'Matrícula', 'Situação', 'Admissão', 'Demissão', 'Filial'],
        r.employees.map((e) => [e.name, e.cpf, e.employeeNumber, e.status && (FUNCAO_EMPLOYEE_STATUS_LABEL[e.status] || e.status), e.hireDate, e.terminationDate, e.origin5]), r))

      // Depois de acionar, o detalhe mostra o que ficou gravado e o que a esteira diz agora.
      run('form-aprovar', 'res-aprovar', async () => {
        const id = encodeURIComponent(val('ap-id'))
        await api('POST', '/admin/proposals/' + id + '/funcao/approve')
        return api('GET', '/admin/proposals/' + id)
      }, (h) => '<p class="hint">Esteira acionada. Status interno: <strong>' + esc(INTERNAL_STATUS_LABEL[h.internalStatus] || h.internalStatus) +
        '</strong> · Função: ' + esc(h.pipeline ? (PIPELINE_STATUS_LABEL[h.pipeline.status] || h.pipeline.status) : 'sem resposta') + '</p>')
    }

    /* ------------------------------------------- Developer › Antifraude (Certta, fora de proposta) */

    /**
     * Consulta avulsa de um CPF no template da Certta: cria a transação (cobrada; a API recusa em
     * produção) e lê o resultado pelo id. A análise manual da Certta pode levar horas: o id fica no
     * campo para consultar de novo. Mostra o resumo e a transação inteira (seções da Receita, endereços, processos, vínculos PF): só aqui, nunca gravada nem logada.
     */
    function antifraudScreen(isCurrent) {
      const input = (id, label, extra) => formField(id, label, '<input id="' + id + '" spellcheck="false"' + (extra || '') + '>')
      app.innerHTML =
        '<div class="card"><h1>Antifraude — Certta</h1><p class="hint">Background check do template configurado (<code>CERTTA_TEMPLATE_ID</code>), fora de proposta. <strong>Cada consulta cria uma transação cobrada</strong>; o <code>idInterno</code> vai como <code>dev-…</code>. Recusada em produção.</p>' +
        alertBox('erro-antifraude') + '</div>' +
        '<div class="card"><h2>Consultar CPF</h2>' +
        '<form id="form-af" class="linha" style="margin-bottom:10px">' +
        input('af-cpf', 'CPF', ' required inputmode="numeric"') + input('af-nome', 'Nome', ' required') +
        input('af-mae', 'Nome da mãe', ' required') + formField('af-nasc', 'Nascimento', '<input id="af-nasc" type="date" required>') +
        '<button class="acao" style="flex:0 0 160px">Consultar (cobrada)</button></form></div>' +
        '<div class="card"><h2>Resultado da transação</h2>' +
        '<form id="form-af-tx" class="linha" style="margin-bottom:10px">' + input('af-tx', 'ID da transação', ' required') +
        '<button class="acao" style="flex:0 0 120px">Consultar</button></form>' +
        '<div id="res-af"></div></div>'

      const val = (id) => document.getElementById(id).value.trim()
      const target = document.getElementById('res-af')
      const kv = (rows) => '<table class="tbl kv"><tbody>' + rows.map(([k, v]) => '<tr><th>' + esc(k) + '</th><td>' + v + '</td></tr>').join('') + '</tbody></table>'
      const isPlain = (v) => v === null || typeof v !== 'object'
      // Qualquer formato de secao: objeto vira chave/valor, lista de objetos vira tabela com a uniao das chaves.
      const value = (v, depth = 0) => {
        if (v === null || v === undefined || v === '') return '—'
        if (typeof v === 'boolean') return v ? 'Sim' : 'Não'
        if (isPlain(v)) return labelWithCode(CERTTA_LABEL, String(v))
        if (depth > 6) return '<pre>' + esc(JSON.stringify(v, null, 2)) + '</pre>'
        if (Array.isArray(v)) {
          if (!v.length) return '—'
          if (v.every(isPlain)) return esc(v.join(', '))
          const cols = [...new Set(v.flatMap((o) => isPlain(o) ? [] : Object.keys(o)))]
          return '<div class="rolagem"><table class="tbl kv"><thead><tr>' + cols.map((c) => '<th>' + esc(CERTTA_FIELD_LABEL[c] || c) + '</th>').join('') + '</tr></thead><tbody>' +
            v.map((o) => '<tr>' + cols.map((c) => '<td>' + value(isPlain(o) ? null : o[c], depth + 1) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>'
        }
        const entries = Object.entries(v)
        return entries.length ? kv(entries.map(([k, x]) => [CERTTA_FIELD_LABEL[k] || k, value(x, depth + 1)])) : '—'
      }
      const render = (r) => {
        const { sections = {}, ...rest } = r.transaction || {}
        const names = Object.keys(sections)
        return '<div class="af">' +
          kv([['Transação', esc(r.transactionId)], ['Situação', esc(ANTIFRAUD_STATUS_LABEL[r.status] || r.status)], ['Status na Certta', labelWithCode(CERTTA_LABEL, r.providerStatus)],
          ['Indício de fraude', r.fraud == null ? '—' : (r.fraud ? 'Sim' : 'Não')], ['Motivos', esc(certtaReasons(r.reasons))]]) +
          '<details open><summary>Transação<span class="sub">status, histórico, regras avaliadas, dados enviados, metadados</span></summary>' + value(rest) + '</details>' +
          '<h2 style="margin-top:16px">Seções (' + names.length + ')</h2>' +
          (names.length ? names.map((n) => {
            const sec = sections[n] || {}
            const meta = [n, sec.statusCode && labelCodeText(CERTTA_SECTION_STATUS_LABEL, sec.statusCode), sec.message].filter(Boolean).join(' · ')
            return '<details><summary>' + esc(CERTTA_SECTION_LABEL[n] || n) + '<span class="sub">' + esc(meta) + '</span></summary>' + value(sec) + '</details>'
          }).join('') : '<p class="hint">A Certta não devolveu seções.</p>') +
          '<details><summary>JSON bruto</summary><pre>' + esc(JSON.stringify(r.transaction, null, 2)) + '</pre></details>' +
          '</div>'
      }
      const submit = (formId, action) => {
        document.getElementById(formId).onsubmit = async (ev) => {
          ev.preventDefault()
          clearError('erro-antifraude')
          target.innerHTML = '<p class="hint">Consultando…</p>'
          try {
            const r = await action()
            if (isCurrent()) target.innerHTML = render(r)
          } catch (err) {
            if (isCurrent()) { target.innerHTML = ''; showError('erro-antifraude', err.message) }
          }
        }
      }
      const lookup = (id) => api('GET', '/admin/antifraud/transactions/' + encodeURIComponent(id))

      submit('form-af', async () => {
        const { transactionId } = await api('POST', '/admin/antifraud/transactions', {
          cpf: val('af-cpf'), name: val('af-nome'), motherName: val('af-mae'), birthDate: val('af-nasc'),
        })
        if (isCurrent()) document.getElementById('af-tx').value = transactionId
        return lookup(transactionId)
      })
      submit('form-af-tx', () => lookup(val('af-tx')))
      if (pendingAntifraudTx) {
        document.getElementById('af-tx').value = pendingAntifraudTx
        pendingAntifraudTx = null
        document.getElementById('form-af-tx').requestSubmit()
      }
    }

    // `vigente` da aba Lotes: a consulta de um lote recarrega a lista depois, quando a aba pode ja ter mudado.
    let batchesIsCurrent = () => false

    function batchesScreen(isCurrent) {
      batchesIsCurrent = isCurrent
      app.innerHTML =
        '<div class="card">' +
        '<h1>Planilha de vínculos</h1>' +
        '<p class="hint">O empregador deposita a planilha (.xlsx com as abas <strong>Ativos</strong> e <strong>DEMITIDOS</strong>, ou .csv único separado pela coluna SITUACAO) na caixa de entrada do bucket; o serviço a busca sozinho a cada ciclo e cria um lote. Antes de ler, o arquivo passa por uma verificação de integridade; depois de gravar, o serviço confere que o banco tem as linhas aceitas. O lote fica <strong>Processando</strong> enquanto é lido e, ao terminar, vira <strong>Processado</strong> — vigente, no lugar do anterior — ou <strong>Recusado</strong>, com o motivo, quando o arquivo está errado. Falha inesperada deixa o lote <strong>Tentando de novo</strong> e o próximo ciclo repete, até 3 tentativas; esgotadas, vira <strong>Falhou</strong> e o arquivo fica guardado para a equipe de T.I. Linhas recusadas ficam no lote para consulta. Canais e filiais ficam na aba Configurações.</p>' +
        alertBox('erro-lote') +
        '<button class="acao" id="btn-atualizar">Atualizar lotes</button>' +
        '</div>' +
        '<div id="validacao"></div>' +
        '<div class="card"><h2>Lotes</h2><div id="lista-lotes"><p class="hint">Carregando…</p></div></div>'

      document.getElementById('btn-atualizar').onclick = () => {
        clearError('erro-lote')
        loadBatches()
      }

      loadBatches()
    }

    /** Consulta o lote ate ele sair de PROCESSING: o worker da caixa de entrada pode estar no meio dele. */
    async function watchBatch(batchId) {
      const isCurrent = batchesIsCurrent
      for (; ;) {
        let batch
        try {
          batch = await api('GET', DATASETS.EMPLOYMENT.path + '/' + batchId)
        } catch (err) {
          if (isCurrent()) showError('erro-lote', err.message)
          return
        }
        if (!isCurrent()) return
        paintBatchResult(batch)
        if (batch.status !== 'PROCESSING') return loadBatches()
        loadBatches()
        await new Promise((r) => setTimeout(r, 1000))
      }
    }

    function paintBatchResult(r) {
      document.getElementById('validacao').innerHTML =
        '<div class="card" data-lote="' + esc(r.id) + '" data-status="' + esc(r.status) + '">' +
        '<h2>Planilha <span class="tag ' + esc(r.status) + '">' + esc(batchStatusLabel(r.status)) + '</span></h2>' +
        (r.errorMessage ? '<div class="aviso erro">' + esc(r.errorMessage) + '</div>' : '') +
        boxes([
          { label: 'Arquivo', value: r.filename },
          { label: 'Linhas lidas', value: r.rowCount + r.rejectedCount },
          { label: 'Linhas aceitas', value: r.rowCount, highlight: true },
          { label: 'Linhas rejeitadas', value: r.rejectedCount },
        ]) +
        (r.rejections && r.rejections.length
          ? '<div class="rolagem"><table class="tbl"><thead><tr><th>Linha</th><th>Campo</th><th>Motivo</th></tr></thead><tbody>' +
          r.rejections.map((j) => '<tr><td class="num">' + (j.sheet ? esc(j.sheet) + ' · ' : '') + esc(j.line) + '</td><td>' + esc(j.field) + '</td><td>' + esc(j.reason) + '</td></tr>').join('') +
          '</tbody></table></div>' +
          // rejectedCount conta linhas e rejections, motivos (varios por linha): truncou se faltou linha
          (new Set(r.rejections.map((j) => j.sheet + '|' + j.line)).size < r.rejectedCount ? '<p class="hint">Mostrando as primeiras ' + esc(r.rejections.length) + ' rejeições.</p>' : '')
          : '') +
        '</div>'
    }

    /**
     * Lote vigente por base: o PUBLISHED mais recente. O banco ja garante um so por base (indice unico
     * parcial em `employment_batch`); aqui e so para a tela dizer, por base, o que a elegibilidade e a
     * resolucao de origem estao lendo — e gritar quando uma base nao tem lote vigente.
     */
    function currentByDataset(batches) {
      const r = {}
      for (const base of Object.keys(DATASETS)) {
        r[base] = batches
          .filter((b) => b.dataset === base && b.status === 'PUBLISHED')
          .sort((a, b) => (a.publishedAt < b.publishedAt ? 1 : -1))[0] || null
      }
      return r
    }

    async function loadBatches() {
      const isCurrent = batchesIsCurrent
      const target = document.getElementById('lista-lotes')
      try {
        const { batches } = await api('GET', DATASETS.EMPLOYMENT.path)
        if (!isCurrent()) return
        batches.sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1))
        const currentBatches = currentByDataset(batches)
        const withoutCurrent = Object.keys(currentBatches).filter((k) => !currentBatches[k])
        target.innerHTML =
          '<div class="grid" id="vigentes">' + Object.entries(currentBatches).map(([k, b]) =>
            '<div class="box' + (b ? '' : ' destaque') + '" data-vigente="' + k + '"><div class="rot">' + esc(DATASET_LABEL[k]) + ' — vigente</div>' +
            '<div class="val">' + (b ? esc(b.filename) + '<span class="sub">' + esc(b.rowCount + b.rejectedCount) + ' linhas lidas · ' + esc(b.rowCount) + ' aceitas · ' + esc(formatDateTime(b.publishedAt)) + '</span>' : '<span class="fail">Sem lote vigente</span>') + '</div></div>').join('') +
          '</div>' +
          (withoutCurrent.length ? '<div class="aviso erro">Sem lote vigente em ' + esc(withoutCurrent.map((k) => DATASET_LABEL[k]).join(', ') + '. Propostas que dependem dessa base ficam indisponíveis (erro para o colaborador) até a publicação.') + '</div>' : '') +
          (batches.length
            ? '<div class="rolagem"><table class="tbl"><thead><tr>' +
            '<th>Base</th><th>Arquivo</th><th>Status</th><th>Tentativas</th><th>Lidas</th><th>Aceitas</th><th>Rejeitadas</th><th>Criado</th><th>Publicado por</th><th></th>' +
            '</tr></thead><tbody>' +
            batches.map((b) =>
              '<tr>' +
              '<td>' + esc(DATASET_LABEL[b.dataset] || b.dataset) + '</td>' +
              '<td class="quebra">' + esc(b.filename) + '</td>' +
              '<td><span class="tag ' + esc(b.status) + '">' + esc(batchStatusLabel(b.status)) + '</span>' + (currentBatches[b.dataset] === b ? '<span class="sub">vigente</span>' : '') + (b.errorMessage ? '<span class="sub fail">' + esc(b.errorMessage) + '</span>' : '') + '</td>' +
              '<td class="num">' + esc(b.attempts + '/' + b.maxAttempts) + '<span class="sub">' + esc(formatDateTime(b.lastAttemptAt)) + '</span></td>' +
              '<td class="num">' + esc(b.rowCount + b.rejectedCount) + '</td>' +
              '<td class="num">' + esc(b.rowCount) + '</td>' +
              '<td class="num">' + esc(b.rejectedCount) + '</td>' +
              '<td>' + esc(formatDateTime(b.createdAt)) + '</td>' +
              '<td>' + (b.publishedBy ? esc(b.publishedBy) + '<span class="sub">' + esc(formatDateTime(b.publishedAt)) + '</span>' : '—') + '</td>' +
              '<td>' + (b.rejectedCount > 0 ? '<button class="alterar" data-detalhe="' + esc(b.id) + '">Ver rejeições</button>' : '') + '</td>' +
              '</tr>').join('') +
            '</tbody></table></div>'
            : '<p class="hint">Nenhum lote importado ainda.</p>')
        for (const b of document.querySelectorAll('[data-detalhe]')) {
          b.onclick = (ev) => watchBatch(ev.currentTarget.dataset.detalhe)
        }
      } catch (err) {
        if (isCurrent()) target.innerHTML = '<div class="aviso erro">' + esc(err.message) + '</div>'
      }
    }

    /* ---------------------------------------------------------- Configuracoes */

    // Empregadores (Origem 4) e filiais (Origem 5) em uma tela so, somente leitura: vem do catalogo da

      '<div class="rolagem"><table class="tbl"><thead><tr>' + headers.map((c) => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
      rows.map((cells) => '<tr>' + cells.map((c) => '<td>' + esc(c || '—') + '</td>').join('') + '</tr>').join('') +

        '<div class="card">' +
        '<h1>Configurações</h1>' +
        alertBox('erro-config') +
        '<p class="hint" id="config-atualizado">Origens lidas da Função.</p>' +
        '<h2>Empregadores (Origem 4)</h2>' +
        '<p class="hint">Empregador pelo qual a venda entra na Função — o código vai como Origem 4 em toda simulação e proposta. Inativo não libera nenhuma filial.</p>' +

          : 'Nenhum empregador na Função.'

          ? readOnlyTable(['Código na Função', 'Descrição', 'CNPJ da filial', 'Empregador (Origem 4)'],

          : 'Nenhuma filial na Função.'
      }).catch((err) => { if (isCurrent()) showError('erro-config', err.message) })
