    /* ------------------------------------------------------------ 2 · Erros */

    /* -------------------------------------------------------- Funcionarios */

    // Ativo em verde e desligado em cinza: as mesmas cores de lote vigente e substituido.
    const EMPLOYMENT_STATUS_LABEL = { ACTIVE: ['Ativo', 'PUBLISHED'], TERMINATED: ['Desligado', 'SUPERSEDED'] }
    const EMPLOYEES_PER_PAGE = 50
    const NO_EMPLOYEE_FILTER = { search: '', employeeNumber: '', status: '', hireDateFrom: '', hireDateTo: '', page: 1 }
    let employeeFilter = NO_EMPLOYEE_FILTER

    /** Tempo de casa até hoje, por aniversário de calendário como o `completedYears` da API. Só exibição:
     * a faixa do convênio é decidida na API. Admissão ausente ou no futuro = traço. */
    function tenureText(hireDate, today = new Date()) {
      const m = String(hireDate || '').match(/^(\d{4})-(\d{2})-(\d{2})/)
      if (!m) return '—'
      const months = (today.getFullYear() - Number(m[1])) * 12 + (today.getMonth() + 1 - Number(m[2])) - (today.getDate() < Number(m[3]) ? 1 : 0)
      if (months < 0) return '—'
      const n = (q, one, many) => q + ' ' + (q === 1 ? one : many)
      const years = Math.floor(months / 12)
      const remainder = months % 12
      if (!years) return remainder ? n(remainder, 'mês', 'meses') : 'menos de 1 mês'
      return n(years, 'ano', 'anos') + (remainder ? ' e ' + n(remainder, 'mês', 'meses') : '')
    }

    /**
     * Topo da aba: como foi a ultima planilha recebida (deu certo ou errado, com data, motivo e
     * tentativas) e, se nao foi ela que virou a base, qual e a vigente. A API devolve do mais novo ao
     * mais antigo.
     */
    function paintLastIngestion(isCurrent) {
      api('GET', DATASETS.EMPLOYMENT.path).then(({ batches }) => {
        if (!isCurrent()) return
        const [last] = batches
        const current = currentByDataset(batches).EMPLOYMENT
        const target = document.getElementById('ultima-ingestao')
        if (!last) {
          target.innerHTML = '<div class="aviso erro">Nenhuma planilha recebida ainda: sem base de funcionários.</div>'
          return
        }
        const [statusTone, hint] = BATCH_STATUS_HINT[last.status] || ['info', '']
        // Publicada com linha recusada não é "tudo certo": quem não entrou não passa na elegibilidade.
        const tone = statusTone === 'ok' && last.rejectedCount > 0 ? 'alerta' : statusTone
        target.innerHTML =
          '<div class="aviso ' + tone + '" data-status="' + esc(last.status) + '">' +
          '<strong>Última planilha:</strong> ' + esc(last.filename) + ' <span class="tag ' + esc(last.status) + '">' + esc(batchStatusLabel(last.status)) + '</span><br>' +
          'Recebida em ' + esc(formatDateTime(last.createdAt)) +
          (last.lastAttemptAt ? ' · última tentativa em ' + esc(formatDateTime(last.lastAttemptAt)) : '') +
          ' · tentativas: ' + esc(last.attempts + ' de ' + last.maxAttempts) +
          (last.status === 'PUBLISHED' ? ' · ' + esc(last.rowCount) + ' vínculos' : '') +
          (last.rejectedCount > 0 ? ' · <strong>' + esc(last.rejectedCount) + ' linha(s) recusada(s)</strong>' : '') +
          (last.errorMessage ? '<br><strong>Motivo:</strong> ' + esc(last.errorMessage) : '') +
          '<br>' + esc(hint) +
          (current && current !== last ? '<br>Base em uso: ' + esc(current.filename) + ', publicada em ' + esc(formatDateTime(current.publishedAt)) + '.' : '') +
          (current ? '' : '<br><strong>Sem base vigente:</strong> ninguém passa na elegibilidade até uma planilha ser publicada.') +
          '<div id="ultima-ingestao-recusas"></div>' +
          '</div>'
        if (last.rejectedCount > 0) paintLastRejections(last.id, isCurrent)
      }).catch(() => { /* a aba segue funcionando sem o aviso */ })
    }

    function paintLastRejections(batchId, isCurrent) {

          batch.rejections.map((j) => '<tr><td class="num">' + (j.sheet ? esc(j.sheet) + ' · ' : '') + esc(j.line) + '</td><td>' + esc(j.field) + '</td><td>' + esc(j.reason) + '</td></tr>').join('') +
          '</tbody></table></div>' +

    }

    /* --------------------------------------------------------------- boot */

    // O selftest cobre as duas funcoes puras que erram em silencio: uma chave a mais no payload e o
    // `.strict()` da API recusa o PATCH inteiro; uma mensagem de erro mal extraida esconde o motivo.
    // E as derivacoes de tela que decidem o que o operador/colaborador ve: trilha da saga (sem vazar
    // etapa de inelegivel), filas, desfecho desconhecido, leitura da auditoria e lote vigente.
    function selftest() {
      const cases = []
      const check = (name, actual, expected) => cases.push({
        name, ok: JSON.stringify(actual) === JSON.stringify(expected), actual: JSON.stringify(actual), expected: JSON.stringify(expected),
      })

      check('omite vazios, ignora chave desconhecida, apara espaços',
        buildSupplementPayload({ motherName: '  Maria  ', documentNumber: '', documentState: '   ', unknownKey: 'x', pep: '' }),
        { motherName: 'Maria' })
      check('renda em pt-BR vira número',
        buildSupplementPayload({ otherIncome: '1.250,50' }).otherIncome, 1250.5)
      check('renda sem milhar também', parseBrNumber('1250,50'), 1250.5)
      check('renda já em formato cru passa direto', parseBrNumber('1250.5'), 1250.5)
      check('pep só entra quando escolhido — "nao" é false',
        buildSupplementPayload({ pep: 'nao' }), { pep: false })
      check('pep "sim" é true', buildSupplementPayload({ pep: 'sim' }), { pep: true })
      check('message em lista vira frase', errorMessage({ message: ['a', 'b'] }, 400), 'a b')
      check('esteira ausente não desenha nada', pipelineBox(null), '')
      check('esteira traduz a situação', /Liberada — Tela de confirmação/.test(pipelineBox({ status: 'RELEASED', activityDescription: 'Tela de confirmação', reasons: [] })), true)
      check('problem+json usa o title', errorMessage({ title: 'Proposta não encontrada.', status: 404 }, 404), 'Proposta não encontrada.')
      check('erro do Zod mostra o motivo, não "Validation failed"',
        errorMessage({ statusCode: 400, message: 'Validation failed', errors: [{ message: 'Informe exatamente um dos dois.' }] }, 400),
        'Informe exatamente um dos dois.')
      check('sem message usa fallback por status', errorMessage(null, 500), 'Serviço indisponível agora. Tente novamente.')
      check('data ISO vira pt-BR', formatDate('2026-03-09T00:00:00.000Z'), '09/03/2026')
      check('convênio explica a faixa de tempo de casa',
        agreementText({ code: '003030', tenureMinYears: 1, tenureMaxYears: 3 }, 2),
        'Convênio 003030 — de 1 a 3 anos de casa (você tem 2 anos)')
      check('faixa aberta vira "ou mais"',
        agreementText({ code: '003034', tenureMinYears: 7, tenureMaxYears: null }, 9),
        'Convênio 003034 — 7 anos de casa ou mais (você tem 9 anos)')
      check('status tem rótulo', [STATUS_LABEL.NOT_SUBMITTED, JOURNEY_STEP_LABEL.ANALYSIS], ['Não enviada', 'Análise da instituição'])
      check('recusada sem chegar à Função usa a frase neutra (RF-ELG-002/003)',
        [statusMessage({ status: 'REJECTED' }), statusMessage({ status: 'REJECTED', proposalNumber: '1' })],
        ['Não há oferta disponível para o cliente informado.', 'A proposta não foi aprovada pela instituição financeira.'])
      check('estado interno traduzido, código junto', labelCodeText(INTERNAL_STATUS_LABEL, 'ERROR_RETRYABLE'), 'Erro retentável · ERROR_RETRYABLE')
      check('motivo com detalhe usa o prefixo', labelOf(REASON_LABEL, 'FUNCAO_UNAVAILABLE: inclusao http=503'), 'Função indisponível')
      check('código sem rótulo aparece cru', [reasonLabel('NOVO_CODIGO'), reasonLabel(null)], ['NOVO_CODIGO', '—'])
      check('box de código: rótulo no valor, código no sub', codeBox('Estado interno', INTERNAL_STATUS_LABEL, 'FAILED_PERMANENT'),
        { label: 'Estado interno', value: 'Falha definitiva (DLQ)', sub: 'FAILED_PERMANENT' })
      check('status da etapa traduzido', ['PENDING', 'SUCCEEDED', 'FAILED'].map(stepStatusLabel), ['em andamento', 'concluída', 'com falha'])
      const today = new Date(2026, 9, 12)
      check('tempo de casa em anos e meses', tenureText('2024-03-10', today), '2 anos e 7 meses')
      check('tempo de casa fecha o ano no aniversário', tenureText('2025-10-12', today), '1 ano')
      check('na véspera do aniversário ainda não fechou', tenureText('2025-10-13', today), '11 meses')
      check('admitido neste mês', tenureText('2026-10-01', today), 'menos de 1 mês')
      check('admissão ausente ou futura vira traço', [tenureText(null, today), tenureText('2026-11-01', today)], ['—', '—'])
      check('filtro vazio não vai na query', queryFiltros({ pageSize: 50, status: '', step: 'SIMULATION', from: '2026-10-01', to: '' }),
        'pageSize=50&step=SIMULATION&from=2026-10-01')

      const states = (p) => journeySteps(p).map((e) => e.state)
      check('trilha: dados em curso',
        states({ status: 'NOT_SUBMITTED', step: 'CUSTOMER_DATA' }), ['concluida', 'atual', 'pendente', 'pendente', 'pendente'])
      check('trilha: na Função',
        states({ status: 'UNDER_REVIEW', step: 'ANALYSIS', proposalNumber: '1' }), ['concluida', 'concluida', 'concluida', 'atual', 'pendente'])
      check('trilha: recusa do envio marca o envio, o resto não vem sozinho',
        states({ status: 'ERROR', step: 'SUBMISSION' }), ['concluida', 'concluida', 'falha', 'neutra', 'neutra'])
      check('trilha: aprovada fecha tudo', states({ status: 'APPROVED', step: 'FINISHED', proposalNumber: '1' }).every((e) => e === 'concluida'), true)
      check('trilha: reprovada pela Função', states({ status: 'REJECTED', step: 'FINISHED', proposalNumber: '1' })[4], 'falha')
      check('trilha: inelegível não mostra até onde chegou (RF-ELG-002/003)',
        journeySteps({ status: 'REJECTED', step: 'FINISHED', proposalNumber: null }), [])

      const f = queuesSummary([
        { internalStatus: 'ERROR_RETRYABLE', retryScheduledAt: '2026-10-01T10:05:00Z', dlq: null },
        { internalStatus: 'ERROR_RETRYABLE', retryScheduledAt: '2026-10-01T10:01:00Z', dlq: null },
        { internalStatus: 'SUBMITTING', retryScheduledAt: null, dlq: null },
        { internalStatus: 'FAILED_PERMANENT', retryScheduledAt: null, dlq: { at: 'x', reason: 'RETRY_EXHAUSTED' } },
      ])
      check('filas: retry em ordem de execução', f.retry.map((p) => p.retryScheduledAt), ['2026-10-01T10:01:00Z', '2026-10-01T10:05:00Z'])
      check('filas: contagens', [f.submitting.length, f.awaitingData.length, f.dlq.length, f.byInternalStatus[0]], [1, 0, 1, ['ERROR_RETRYABLE', 2]])

      const historyView = (internalStatus, steps, retries) => ({ internalStatus, steps: steps || [], retries: retries || [] })
      check('desfecho desconhecido reconhecido pela etapa',
        awaitsReconciliation(historyView('SUBMITTING', [{ step: 'INCLUSION', status: 'PENDING', reasonCode: 'PROPOSAL_OUTCOME_UNKNOWN' }])), true)
      check('inclusão em curso não é desfecho desconhecido',
        awaitsReconciliation(historyView('SUBMITTING', [{ step: 'INCLUSION', status: 'PENDING', reasonCode: null }])), false)
      check('DLQ orienta nova simulação, não reprocesso', /nova simulação/.test(supportNote(historyView('FAILED_PERMANENT'))), true)
      check('retry agendado: o worker reprocessa sozinho', /sozinho/.test(supportNote(historyView('ERROR_RETRYABLE', [], [{ processedAt: null, deadAt: null }]))), true)
      check('desfecho desconhecido: o serviço resolve sozinho', /Função a cada minuto/.test(supportNote(historyView('SUBMITTING', [{ step: 'INCLUSION', status: 'PENDING', reasonCode: 'PROPOSAL_OUTCOME_UNKNOWN' }]))), true)

      const currentBatches = currentByDataset([
        { dataset: 'EMPLOYMENT', status: 'SUPERSEDED', publishedAt: '2026-09-30' },
        { dataset: 'EMPLOYMENT', status: 'PUBLISHED', publishedAt: '2026-09-20', id: 'b' },
        { dataset: 'EMPLOYMENT', status: 'REJECTED', publishedAt: null },
      ])
      check('lote vigente é o PUBLISHED, nunca REJECTED/SUPERSEDED', currentBatches.EMPLOYMENT && currentBatches.EMPLOYMENT.id, 'b')
      check('base sem PUBLISHED fica sem vigente', currentByDataset([]).EMPLOYMENT, null)
      check('status do lote no vocabulário do operador', ['PROCESSING', 'PUBLISHED', 'REJECTED', 'RETRYING', 'FAILED'].map(batchStatusLabel).join('/'), 'Processando/Processado/Recusado/Tentando de novo/Falhou')
      check('health fica fora do /api', serviceRoot('http://localhost:3010/api/'), 'http://localhost:3010')

      // Revisão do Reviewr (B1–B9, S1–S7)
      check('roteamento pelo step da API', [
        { status: 'NOT_SUBMITTED', step: 'OFFER', offers: [{}] },
        { status: 'NOT_SUBMITTED', step: 'CUSTOMER_DATA', selectedOfferId: 'c' },
        { status: 'NOT_SUBMITTED', step: 'SUBMISSION', selectedOfferId: 'c' },
        { status: 'ERROR', step: 'SUBMISSION', selectedOfferId: 'c', canRetry: true },
        { status: 'ERROR', step: 'FINISHED', selectedOfferId: 'c', canRetry: false },
        { status: 'UNDER_REVIEW', step: 'ANALYSIS', selectedOfferId: 'c' },
        { status: 'REJECTED', step: 'FINISHED', selectedOfferId: null },
        { status: 'NOT_SUBMITTED', step: 'OFFER', offers: [] },
      ].map(stepFor), [2, 3, 4, 4, 5, 5, 5, 5])
      check('B1: recusa da inclusão (canRetry) volta ao envio', canResume({ status: 'ERROR', selectedOfferId: 'c', canRetry: true }), true)
      check('B1: erro sem condição (simulação) não oferece', canResume({ status: 'ERROR', selectedOfferId: null, canRetry: true }), false)
      check('B1: DLQ (sem canRetry) não oferece', canResume({ status: 'ERROR', selectedOfferId: 'c', canRetry: false }), false)
      check('crédito máximo é a oferta de maior valor da Função', bestOffer([{ requestedAmount: 900 }, { requestedAmount: 1500 }, { requestedAmount: 1200 }]), { requestedAmount: 1500 })
      check('sem oferta não há crédito máximo', [bestOffer([]), bestOffer(undefined)], [null, null])
      check('ajuste: oferta do requote não se diz crédito máximo',
        [offerHeadline({ requestedInstallment: null }), offerHeadline({ requestedInstallment: 600 })], ['Valor escolhido por você', 'Crédito máximo disponível'])
      check('ajuste: valor pt-BR na faixa vai em centavos, limites inclusos',
        [checkRequoteAmount('1.250,50', 500, 2000), checkRequoteAmount('500', 500, 2000), checkRequoteAmount('2000.004', 500, 2000)],
        [{ amount: 1250.5 }, { amount: 500 }, { amount: 2000 }])
      check('ajuste: abaixo do piso, acima do máximo ou vazio não vai à API',
        ['499,99', '2000.01', ''].map((v) => 'error' in checkRequoteAmount(v, 500, 2000)), [true, true, true])
      check('ajuste: mínimo do prazo vem da API e nunca fica abaixo de R$ 500',
        [termRange({ minAmount: 808, availableAmount: 3600 }, 500), termRange({ minAmount: 120, availableAmount: 3600 }, 500), termRange({ availableAmount: 900 }, 500)],
        [{ min: 808, max: 3600 }, { min: 500, max: 3600 }, { min: 500, max: 900 }])
      check('ajuste: trocar de prazo mantém o valor na faixa; vazio vira o máximo',
        [clampAmount(2000, 808, 3600), clampAmount(5000, 808, 3600), clampAmount(600, 808, 3600), clampAmount(NaN, 808, 3600)],
        [2000, 3600, 808, 3600])
      check('erro do Zod leva o nome do campo',
        errorMessage({ errors: [{ path: ['district'], message: 'Too big' }, { path: ['x'], message: 'Outro' }] }, 400), 'Bairro do endereço: Too big Outro')
      check('maxlength espelha a API', /maxlength="25"/.test(textInput('district', '')), true)

      check('B7: sem valor calculado o box some', requestedInstallmentLabel({ requestedInstallment: null, employee: { salary: 1000 } }), null)
      check('B7: renda estimada não diz "seu salário"', /renda estimada/.test(requestedInstallmentLabel({ requestedInstallment: 600, employee: { salary: 0 } })), true)
      check('B7: com salário cita o salário da API', /30% do seu salário de R\$\s?2\.000,00/.test(requestedInstallmentLabel({ requestedInstallment: 600, employee: { salary: 2000 } })), true)

      check('S3: polling desacelera e para', [0, 9, 10, 29, 30].map(nextPollDelay), [3000, 3000, 15000, 15000, null])
      check('S4: erro sem retry vira balde próprio', queuesSummary([
        { internalStatus: 'ERROR_RETRYABLE', retryScheduledAt: null, dlq: null },
        { internalStatus: 'ERROR_RETRYABLE', retryScheduledAt: 'x', dlq: null },
      ]).stalled.length, 1)
      check('S5: cancelada pela Função encerra neutra; antes do envio, sem trilha',
        [states({ status: 'CANCELLED', step: 'FINISHED', proposalNumber: '1' })[4], states({ status: 'CANCELLED', step: 'FINISHED' }).length],
        ['neutra', 0])

      const t1 = newScreen()
      const t2 = newScreen()
      check('B5/B6: só a tela mais recente pinta', [t1(), t2()], [false, true])

      app.innerHTML = '<div class="card"><h1>Selftest</h1>' + cases.map((c) =>
        '<p class="' + (c.ok ? 'ok' : 'fail') + '">' + (c.ok ? '✓' : '✗') + ' ' + esc(c.name) +
        (c.ok ? '' : '<br><small>esperado ' + esc(c.expected) + ', veio ' + esc(c.actual) + '</small>') + '</p>'
      ).join('') + '<p class="hint">' + cases.filter((c) => c.ok).length + '/' + cases.length + ' ok</p></div>'
    }

    // Uma pagina, tres publicos: colaborador em /, backoffice em /admin/ e developer em /dev/ (ou
    // #admin/#dev, para quem serve a pasta com um servidor estatico simples). O switch do cabecalho
    // troca pelo hash, sem reload: a jornada do colaborador continua no sessionStorage e a aba de cada
    // portal em memoria, entao ir e voltar nao perde o ponto em que cada um estava. O hash vence o caminho.
    const MODES = {
      colaborador: { title: 'Consignado Privado — proposta', brand: 'Consignado Privado', sub: 'Crédito com desconto em folha' },
      admin: { title: 'Backoffice — Consignado', brand: 'Backoffice', sub: 'Operação do Consignado Privado' },
      dev: { title: 'Developer — Consignado', brand: 'Developer', sub: 'Filas, DLQ e cargas em segundo plano' },
    }
    function currentMode() {
      const fromHash = location.hash.slice(1)
      if (MODES[fromHash]) return fromHash
      const fromPath = (location.pathname.match(/^\/(admin|dev)(\/|$)/) || [])[1]
      return fromPath || 'colaborador'
    }

    function applyMode() {
      if (location.hash === '#selftest') return selftest()
      const mode = currentMode()
      const portal = mode !== 'colaborador'
      // O polling do acompanhamento nao pode repintar a tela do portal por cima, nem o das filas a do
      // colaborador.
      clearTimeout(pollTimer)
      clearTimeout(queuesTimer)
      document.body.classList.toggle('admin', portal)
      document.body.classList.toggle('dev', mode === 'dev')
      document.title = MODES[mode].title
      document.getElementById('marca').firstChild.textContent = MODES[mode].brand
      document.getElementById('marca-sub').textContent = MODES[mode].sub
      for (const b of document.querySelectorAll('[data-modo]')) {
        b.setAttribute('aria-selected', String(b.dataset.modo === mode))
      }
      if (portal) {
        portalMode = mode
        renderAdmin()
      } else {
        render()
      }
      window.scrollTo(0, 0)
    }

    for (const b of document.querySelectorAll('[data-modo]')) {
      b.onclick = () => { location.hash = '#' + b.dataset.modo }
    }
    window.addEventListener('hashchange', applyMode)

    // Botao de tema: inverte o que esta na tela e grava a escolha (vence o sistema dali em diante).
    document.getElementById('btn-tema').onclick = () => {
      const dark = document.documentElement.classList.toggle('dark')
      try { localStorage.setItem('buniTheme', dark ? 'dark' : 'light') } catch { /* sem storage: vale so nesta aba */ }
    }
    applyMode()
    if (location.hash !== '#selftest') paintHealth()
  </script>
</body>

</html>
